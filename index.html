<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Music Player</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #1a1a24;
            --text-active: #ffffff;
            --text-inactive: rgba(255, 255, 255, 0.35);
            --btn-bg: rgba(255, 255, 255, 0.1);
        }
        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at 50% 0%, #323245 0%, var(--bg-color) 70%);
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-sizing: border-box;
        }
        
        /* Шапка */
        .header {
            display: flex;
            align-items: center;
            padding: 20px 20px 10px 20px;
            z-index: 10;
        }
        .cover-mini {
            width: 55px;
            height: 55px;
            border-radius: 12px;
            background: linear-gradient(135deg, #444, #111);
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            flex-shrink: 0;
            object-fit: cover;
        }
        .track-info {
            display: flex;
            flex-direction: column;
            justify-content: center;
            overflow: hidden;
            margin-left: 15px;
            flex-grow: 1;
        }
        .track-title {
            font-size: 17px;
            font-weight: 700;
            margin-bottom: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .explicit-icon {
            background-color: rgba(255,255,255,0.2);
            color: #fff;
            font-size: 9px;
            font-weight: bold;
            padding: 1px 4px;
            border-radius: 3px;
        }
        .track-artist {
            font-size: 14px;
            color: var(--text-inactive);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .header-actions {
            display: flex;
            gap: 8px;
            margin-left: 10px;
        }
        .icon-btn {
            background: var(--btn-bg);
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(5px);
            transition: 0.2s;
        }
        .icon-btn:active {
            background: rgba(255,255,255,0.2);
            transform: scale(0.9);
        }
        .icon-btn svg {
            fill: #fff;
            width: 18px;
            height: 18px;
        }

        /* Текст песни */
        .lyrics-container {
            flex-grow: 1;
            padding: 20px;
            padding-bottom: 150px;
            padding-top: 20px;
            overflow-y: auto;
            scroll-behavior: smooth;
            display: flex;
            flex-direction: column;
            mask-image: linear-gradient(to bottom, transparent 0%, black 15%, black 75%, transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 15%, black 75%, transparent 100%);
        }
        .lyrics-container::-webkit-scrollbar {
            display: none;
        }
        
        .lyric-line {
            font-size: 26px;
            font-weight: 700;
            color: var(--text-inactive);
            margin: 12px 0;
            line-height: 1.3;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            filter: blur(1.5px);
            transform-origin: left center;
            cursor: pointer;
            text-align: left;
        }
        .lyric-line.active {
            font-size: 38px;
            color: var(--text-active);
            filter: blur(0);
            margin: 25px 0;
            text-shadow: 0 4px 15px rgba(255,255,255,0.15);
        }

        /* Плеер */
        .player-wrapper {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 20px;
            background: linear-gradient(to top, rgba(26,26,36,1) 30%, rgba(26,26,36,0) 100%);
            box-sizing: border-box;
            z-index: 10;
            transition: transform 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        .player-wrapper.hidden {
            transform: translateY(100%);
        }
        
        audio {
            width: 100%;
            height: 45px;
            outline: none;
            border-radius: 25px;
        }
        
        .status-msg {
            font-size: 20px;
            font-weight: bold;
            color: var(--text-inactive);
            text-align: left;
            margin-top: 40px;
        }

        /* ====== ПЛЕЙЛИСТ ====== */
        .playlist-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.55);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
            z-index: 20;
        }
        .playlist-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }

        .playlist-panel {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            max-height: 75vh;
            background: #23232e;
            border-radius: 24px 24px 0 0;
            padding: 18px 20px 30px;
            box-sizing: border-box;
            z-index: 21;
            transform: translateY(100%);
            transition: transform 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            display: flex;
            flex-direction: column;
            box-shadow: 0 -10px 40px rgba(0,0,0,0.5);
        }
        .playlist-panel.open {
            transform: translateY(0);
        }

        .playlist-handle {
            width: 42px;
            height: 4px;
            background: rgba(255,255,255,0.25);
            border-radius: 2px;
            margin: 0 auto 14px;
            flex-shrink: 0;
        }
        .playlist-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
            flex-shrink: 0;
        }
        .playlist-title {
            font-size: 20px;
            font-weight: 700;
        }
        .playlist-count {
            font-size: 13px;
            color: var(--text-inactive);
            font-weight: 500;
        }
        .playlist-list {
            overflow-y: auto;
            flex-grow: 1;
            margin: 0 -8px;
            padding: 0 8px;
        }
        .playlist-list::-webkit-scrollbar {
            width: 4px;
        }
        .playlist-list::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.15);
            border-radius: 2px;
        }
        .playlist-item {
            display: flex;
            align-items: center;
            padding: 10px;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.15s;
            gap: 12px;
        }
        .playlist-item:active {
            background: rgba(255,255,255,0.06);
        }
        .playlist-item.current {
            background: rgba(255,255,255,0.08);
        }
        .playlist-item-cover {
            width: 46px;
            height: 46px;
            border-radius: 8px;
            background: linear-gradient(135deg, #444, #111);
            object-fit: cover;
            flex-shrink: 0;
        }
        .playlist-item-info {
            flex-grow: 1;
            overflow: hidden;
            min-width: 0;
        }
        .playlist-item-title {
            font-size: 15px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 2px;
        }
        .playlist-item.current .playlist-item-title {
            color: #7dd3fc;
        }
        .playlist-item-artist {
            font-size: 13px;
            color: var(--text-inactive);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .playlist-item-playing {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
            fill: #7dd3fc;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
    </style>
</head>
<body>

    <div class="header">
        <img class="cover-mini" id="cover-image" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=" alt="cover">
        <div class="track-info">
            <div class="track-title">
                <span id="title-display">Загрузка...</span>
                <span class="explicit-icon">E</span>
            </div>
            <div class="track-artist" id="artist-display">Подключение</div>
        </div>
        <div class="header-actions">
            <!-- Кнопка плейлиста -->
            <button class="icon-btn" id="playlist-btn" title="Плейлист">
                <svg viewBox="0 0 24 24"><path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/></svg>
            </button>
            <button class="icon-btn">
                <svg viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
            </button>
            <button class="icon-btn" id="toggle-player-btn" title="Скрыть/Показать плеер">
                <svg viewBox="0 0 24 24"><path d="M6 10c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm12 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm-6 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>
            </button>
        </div>
    </div>

    <div class="lyrics-container" id="lyrics">
        <div class="status-msg">Ищем текст песни... 🔍</div>
    </div>

    <div class="player-wrapper" id="player-wrap">
        <audio id="audio" controls autoplay></audio>
    </div>

    <!-- Оверлей и панель плейлиста -->
    <div class="playlist-overlay" id="playlist-overlay"></div>
    <div class="playlist-panel" id="playlist-panel">
        <div class="playlist-handle"></div>
        <div class="playlist-header">
            <div class="playlist-title">Плейлист</div>
            <div class="playlist-count" id="playlist-count">0 треков</div>
        </div>
        <div class="playlist-list" id="playlist-list"></div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.setHeaderColor('#1a1a24'); 
        tg.setBackgroundColor('#1a1a24');

        const JSONBIN_KEY = "$2a$10$K0t8NaC64RzHdWCbtN.i2.sUpZS28KhFhruBtunwtsz0LB8uEWRsy";

        const audio = document.getElementById('audio');
        const lyricsContainer = document.getElementById('lyrics');
        const titleDisplay = document.getElementById('title-display');
        const artistDisplay = document.getElementById('artist-display');
        const coverImage = document.getElementById('cover-image');
        
        const playerWrap = document.getElementById('player-wrap');
        const togglePlayerBtn = document.getElementById('toggle-player-btn');

        // Плейлист элементы
        const playlistBtn = document.getElementById('playlist-btn');
        const playlistPanel = document.getElementById('playlist-panel');
        const playlistOverlay = document.getElementById('playlist-overlay');
        const playlistList = document.getElementById('playlist-list');
        const playlistCount = document.getElementById('playlist-count');
        
        let lyrics = [];
        let currentActiveIndex = -1;
        let currentTrackId = tg.initDataUnsafe?.start_param;

        // ====== ПЛЕЙЛИСТ ======
        // Список треков: { id: "jsonbin_id", title, artist, audio }
        // Можно заполнить вручную или получить из JSONBin.
        let playlist = [];
        let currentTrackIndex = -1;

        // Открыть/закрыть плейлист
        function openPlaylist() {
            playlistPanel.classList.add('open');
            playlistOverlay.classList.add('open');
        }
        function closePlaylist() {
            playlistPanel.classList.remove('open');
            playlistOverlay.classList.remove('open');
        }
        playlistBtn.addEventListener('click', openPlaylist);
        playlistOverlay.addEventListener('click', closePlaylist);

        // Свайп вниз для закрытия (простой)
        let startY = 0;
        playlistPanel.addEventListener('touchstart', (e) => {
            startY = e.touches[0].clientY;
        }, { passive: true });
        playlistPanel.addEventListener('touchmove', (e) => {
            const dy = e.touches[0].clientY - startY;
            if (dy > 60) closePlaylist();
        }, { passive: true });

        // По клику на три точки плеер полностью уезжает или возвращается
        togglePlayerBtn.addEventListener('click', () => {
            playerWrap.classList.toggle('hidden');
        });

        // ====== ЗАГРУЗКА ТРЕКА ======
        async function loadTrack(trackId) {
            if (!trackId) {
                titleDisplay.innerText = "Ошибка";
                artistDisplay.innerText = "Трек не найден";
                lyricsContainer.innerHTML = '<div class="status-msg">Запустите плеер через бота.</div>';
                return;
            }

            currentTrackId = trackId;

            try {
                const res = await fetch(`https://api.jsonbin.io/v3/b/${trackId}`, {
                    headers: { "X-Master-Key": JSONBIN_KEY }
                });
                const data = await res.json();
                const track = data.record;

                titleDisplay.innerText = track.title;
                artistDisplay.innerText = track.artist;
                audio.src = track.audio;
                audio.play().catch(() => {});

                // Сброс текста
                lyrics = [];
                currentActiveIndex = -1;
                lyricsContainer.innerHTML = '<div class="status-msg">Ищем текст песни... 🔍</div>';

                fetchCover(track.title, track.artist);
                fetchLyrics(track.title, track.artist);

                // Обновляем подсветку в плейлисте
                renderPlaylist();
            } catch (e) {
                titleDisplay.innerText = "Ошибка";
                artistDisplay.innerText = "Сбой загрузки";
            }
        }

        async function fetchCover(title, artist) {
            try {
                const query = encodeURIComponent(artist + ' ' + title);
                const res = await fetch(`https://itunes.apple.com/search?term=${query}&entity=song&limit=1`);
                const data = await res.json();
                if (data.results && data.results.length > 0) {
                    coverImage.src = data.results[0].artworkUrl100;
                }
            } catch (e) {
                console.log("Обложка не найдена");
            }
        }

        async function fetchLyrics(title, artist) {
            try {
                const response = await fetch(`https://lrclib.net/api/search?track_name=${encodeURIComponent(title)}&artist_name=${encodeURIComponent(artist)}`);
                const data = await response.json();
                if (data && data.length > 0 && data[0].syncedLyrics) {
                    parseLrc(data[0].syncedLyrics);
                    renderLyrics();
                } else {
                    lyricsContainer.innerHTML = '<div class="status-msg">Текст песни не найден 😔</div>';
                }
            } catch (error) {
                lyricsContainer.innerHTML = '<div class="status-msg">Ошибка загрузки текста ❌</div>';
            }
        }

        function parseLrc(lrcText) {
            lyrics = [];
            lrcText.split('\n').forEach(line => {
                const match = /\[(\d{2}):(\d{2}\.\d{2,3})\](.*)/.exec(line);
                if (match && match[3].trim() !== '') {
                    lyrics.push({ time: (parseInt(match[1]) * 60) + parseFloat(match[2]), text: match[3].trim() });
                }
            });
        }

        function renderLyrics() {
            lyricsContainer.innerHTML = '';
            
            const padTop = document.createElement('div');
            padTop.style.height = '35vh';
            lyricsContainer.appendChild(padTop);

            lyrics.forEach((line, index) => {
                const el = document.createElement('div');
                el.className = 'lyric-line';
                el.id = 'line-' + index;
                el.innerText = line.text;
                
                el.onclick = () => {
                    audio.currentTime = line.time;
                    audio.play();
                };
                lyricsContainer.appendChild(el);
            });
            
            const padBot = document.createElement('div');
            padBot.style.height = '50vh';
            lyricsContainer.appendChild(padBot);
            
            requestAnimationFrame(syncLyrics);
        }

        function syncLyrics() {
            if (lyrics.length > 0 && !audio.paused) {
                const LYRIC_OFFSET = 0.45; 
                const currentTime = audio.currentTime + LYRIC_OFFSET;
                
                let activeIndex = -1;
                for (let i = 0; i < lyrics.length; i++) {
                    const isLast = i === lyrics.length - 1;
                    if (currentTime >= lyrics[i].time && (isLast || currentTime < lyrics[i + 1].time)) {
                        activeIndex = i;
                        break;
                    }
                }

                if (activeIndex !== -1 && activeIndex !== currentActiveIndex) {
                    currentActiveIndex = activeIndex;
                    
                    document.querySelectorAll('.lyric-line').forEach(e => e.classList.remove('active'));
                    
                    const activeEl = document.getElementById('line-' + activeIndex);
                    if (activeEl) {
                        activeEl.classList.add('active');
                        activeEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }
                }
            }
            requestAnimationFrame(syncLyrics);
        }

        // ====== РЕНДЕР ПЛЕЙЛИСТА ======
        function renderPlaylist() {
            playlistList.innerHTML = '';

            if (playlist.length === 0) {
                playlistList.innerHTML = '<div style="padding:20px;color:rgba(255,255,255,0.35);text-align:center;">Плейлист пуст</div>';
                playlistCount.innerText = '0 треков';
                return;
            }

            playlistCount.innerText = playlist.length + ' ' + pluralizeTracks(playlist.length);

            playlist.forEach((track, index) => {
                const item = document.createElement('div');
                item.className = 'playlist-item' + (track.id === currentTrackId ? ' current' : '');

                const img = document.createElement('img');
                img.className = 'playlist-item-cover';
                img.src = track.cover || 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=';
                img.alt = '';
                item.appendChild(img);

                const info = document.createElement('div');
                info.className = 'playlist-item-info';

                const t = document.createElement('div');
                t.className = 'playlist-item-title';
                t.innerText = track.title || 'Без названия';
                info.appendChild(t);

                const a = document.createElement('div');
                a.className = 'playlist-item-artist';
                a.innerText = track.artist || '';
                info.appendChild(a);

                item.appendChild(info);

                if (track.id === currentTrackId) {
                    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
                    svg.setAttribute('viewBox', '0 0 24 24');
                    svg.setAttribute('class', 'playlist-item-playing');
                    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                    path.setAttribute('d', 'M8 5v14l11-7z');
                    svg.appendChild(path);
                    item.appendChild(svg);
                }

                item.addEventListener('click', () => {
                    if (track.id !== currentTrackId) {
                        currentTrackIndex = index;
                        loadTrack(track.id);
                    }
                    closePlaylist();
                });

                playlistList.appendChild(item);
            });
        }

        function pluralizeTracks(n) {
            const mod10 = n % 10;
            const mod100 = n % 100;
            if (mod10 === 1 && mod100 !== 11) return 'трек';
            if (mod10 >= 2 && mod10 <= 4 && (mod100 < 10 || mod100 >= 20)) return 'трека';
            return 'треков';
        }

        // ====== ЗАГРУЗКА ПЛЕЙЛИСТА ======
        // Вариант 1: плейлист лежит в JSONBin по ID.
        // Вариант 2: массив прямо в коде.

        // Раскомментируй и подставь свой ID бакета с плейлистом:
        // const PLAYLIST_BIN_ID = "xxxxxxxxxxxx";
        // async function loadPlaylist() {
        //     try {
        //         const res = await fetch(`https://api.jsonbin.io/v3/b/${PLAYLIST_BIN_ID}`, {
        //             headers: { "X-Master-Key": JSONBIN_KEY }
        //         });
        //         const data = await res.json();
        //         playlist = data.record.tracks || [];
        //         renderPlaylist();
        //     } catch (e) { console.log('Не удалось загрузить плейлист', e); }
        // }

        // Вариант 2: плейлист прямо в коде (для теста).
        // Каждый трек — это отдельный JSONBin с полями title, artist, audio.
        playlist = [
            // { id: "ID_БАКЕТА_1", title: "Название", artist: "Исполнитель", cover: "" },
            // { id: "ID_БАКЕТА_2", title: "Название 2", artist: "Исполнитель 2", cover: "" },
        ];

        renderPlaylist();

        // ====== АВТОПЕРЕХОД К СЛЕДУЮЩЕМУ ======
        audio.addEventListener('ended', () => {
            if (playlist.length === 0) return;
            let next = currentTrackIndex;
            if (next === -1) {
                next = playlist.findIndex(t => t.id === currentTrackId);
            }
            next = (next + 1) % playlist.length;
            currentTrackIndex = next;
            loadTrack(playlist[next].id);
        });

        // ====== СТАРТ ======
        loadTrack(currentTrackId);
    </script>
</body>
</html>
