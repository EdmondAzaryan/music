<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Player</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            box-sizing: border-box;
            overflow: hidden;
        }
        .cover {
            width: 180px;
            height: 180px;
            background: linear-gradient(135deg, #1db954, #121212);
            border-radius: 12px;
            margin-bottom: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .track-info {
            text-align: center;
            margin-bottom: 15px;
            width: 100%;
            max-width: 350px;
        }
        .track-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .track-artist {
            font-size: 14px;
            color: #aaa;
        }
        .controls {
            width: 100%;
            max-width: 350px;
            margin-bottom: 20px;
        }
        audio {
            width: 100%;
            outline: none;
        }
        .lyrics-container {
            flex-grow: 1;
            width: 100%;
            max-width: 350px;
            overflow-y: scroll;
            text-align: center;
            scroll-behavior: smooth;
            padding-bottom: 50px;
        }
        .lyrics-container::-webkit-scrollbar { display: none; }
        
        .lyric-line {
            font-size: 16px;
            margin: 12px 0;
            color: #666;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .lyric-line.active {
            color: #1db954;
            font-size: 22px;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(29, 185, 84, 0.4);
        }
    </style>
</head>
<body>

    <div class="cover"></div>
    
    <div class="track-info">
        <div class="track-title" id="title-display">Загрузка...</div>
        <div class="track-artist" id="artist-display"></div>
    </div>

    <div class="controls">
        <audio id="audio" controls autoplay></audio>
    </div>

    <div class="lyrics-container" id="lyrics"></div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const audio = document.getElementById('audio');
        const lyricsContainer = document.getElementById('lyrics');
        const titleDisplay = document.getElementById('title-display');
        const artistDisplay = document.getElementById('artist-display');
        let lyrics = [];

        // Получаем данные из URL от бота
        const urlParams = new URLSearchParams(window.location.search);
        const audioUrl = urlParams.get('audio');
        const trackTitle = urlParams.get('title') || 'Музыка'; 
        const trackArtist = urlParams.get('artist') || '';

        titleDisplay.innerText = trackTitle;
        artistDisplay.innerText = trackArtist;

        if (audioUrl) {
            audio.src = audioUrl;
        } else {
            lyricsContainer.innerHTML = '<div class="lyric-line">Ошибка: Ссылка на трек не найдена</div>';
        }

        async function fetchLyrics(title, artist) {
            lyricsContainer.innerHTML = '<div class="lyric-line">Ищем текст песни... 🔍</div>';
            try {
                const response = await fetch(`https://lrclib.net/api/search?track_name=${encodeURIComponent(title)}&artist_name=${encodeURIComponent(artist)}`);
                const data = await response.json();
                
                if (data && data.length > 0 && data[0].syncedLyrics) {
                    parseLrc(data[0].syncedLyrics);
                    renderLyrics();
                } else if (data && data.length > 0 && data[0].plainLyrics) {
                    lyricsContainer.innerHTML = `<div class="lyric-line" style="color:#fff">${data[0].plainLyrics.replace(/\n/g, '<br>')}</div>`;
                } else {
                    lyricsContainer.innerHTML = '<div class="lyric-line">Текст песни не найден 😔</div>';
                }
            } catch (error) {
                lyricsContainer.innerHTML = '<div class="lyric-line">Ошибка загрузки текста ❌</div>';
            }
        }

        function parseLrc(lrcText) {
            lyrics = [];
            const lines = lrcText.split('\n');
            const regex = /\[(\d{2}):(\d{2}\.\d{2,3})\](.*)/;
            
            lines.forEach(line => {
                const match = regex.exec(line);
                if (match) {
                    const time = (parseInt(match[1]) * 60) + parseFloat(match[2]);
                    const text = match[3].trim();
                    if(text) lyrics.push({ time, text });
                }
            });
        }

        function renderLyrics() {
            lyricsContainer.innerHTML = '';
            lyrics.forEach((line, index) => {
                const el = document.createElement('div');
                el.className = 'lyric-line';
                el.id = 'line-' + index;
                el.innerText = line.text;
                el.onclick = () => audio.currentTime = line.time;
                lyricsContainer.appendChild(el);
            });
        }

        audio.addEventListener('timeupdate', () => {
            if (lyrics.length === 0) return;
            const currentTime = audio.currentTime;
            
            for (let i = 0; i < lyrics.length; i++) {
                const isLastLine = i === lyrics.length - 1;
                const isCurrent = currentTime >= lyrics[i].time && (isLastLine || currentTime < lyrics[i + 1].time);
                
                const lineElement = document.getElementById('line-' + i);
                
                if (isCurrent) {
                    if (!lineElement.classList.contains('active')) {
                        document.querySelectorAll('.lyric-line').forEach(el => el.classList.remove('active'));
                        lineElement.classList.add('active');
                        lineElement.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }
                    break;
                }
            }
        });

        fetchLyrics(trackTitle, trackArtist);
    </script>
</body>
</html>
