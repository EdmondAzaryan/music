<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Music Player</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #1a1a24;
            --text-active: #ffffff;
            --text-inactive: rgba(255, 255, 255, 0.35);
            --btn-bg: rgba(255, 255, 255, 0.1);
        }
        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at 50% 0%, #323245 0%, var(--bg-color) 70%);
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-sizing: border-box;
        }
        
        /* Шапка: обложка, инфа и кнопки */
        .header {
            display: flex;
            align-items: center;
            padding: 20px 20px 10px 20px;
            z-index: 10;
        }
        .cover-mini {
            width: 55px;
            height: 55px;
            border-radius: 12px;
            background: linear-gradient(135deg, #444, #111);
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            flex-shrink: 0;
            object-fit: cover;
        }
        .track-info {
            display: flex;
            flex-direction: column;
            justify-content: center;
            overflow: hidden;
            margin-left: 15px;
            flex-grow: 1;
        }
        .track-title {
            font-size: 17px;
            font-weight: 700;
            margin-bottom: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .explicit-icon {
            background-color: rgba(255,255,255,0.2);
            color: #fff;
            font-size: 9px;
            font-weight: bold;
            padding: 1px 4px;
            border-radius: 3px;
        }
        .track-artist {
            font-size: 14px;
            color: var(--text-inactive);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Кнопки справа в шапке */
        .header-actions {
            display: flex;
            gap: 8px;
            margin-left: 10px;
        }
        .icon-btn {
            background: var(--btn-bg);
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(5px);
            transition: 0.2s;
        }
        .icon-btn:active {
            background: rgba(255,255,255,0.2);
            transform: scale(0.9);
        }
        .icon-btn svg {
            fill: #fff;
            width: 18px;
            height: 18px;
        }

        /* Контейнер с текстом песни */
        .lyrics-container {
            flex-grow: 1;
            padding: 20px;
            padding-bottom: 150px;
            padding-top: 20px;
            overflow-y: auto;
            scroll-behavior: smooth;
            display: flex;
            flex-direction: column;
            mask-image: linear-gradient(to bottom, transparent 0%, black 15%, black 75%, transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 15%, black 75%, transparent 100%);
        }
        .lyrics-container::-webkit-scrollbar {
            display: none;
        }
        
        .lyric-line {
            font-size: 26px;
            font-weight: 700;
            color: var(--text-inactive);
            margin: 12px 0;
            line-height: 1.3;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            filter: blur(1.5px);
            transform-origin: left center;
            cursor: pointer;
            text-align: left;
        }
        .lyric-line.active {
            font-size: 38px;
            color: var(--text-active);
            filter: blur(0);
            margin: 25px 0;
            text-shadow: 0 4px 15px rgba(255,255,255,0.15);
        }

        /* Нижняя панель с плеером */
        .player-wrapper {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 20px;
            background: linear-gradient(to top, rgba(26,26,36,1) 30%, rgba(26,26,36,0) 100%);
            box-sizing: border-box;
            z-index: 10;
            transition: transform 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        .player-wrapper.hidden {
            transform: translateY(100%);
        }
        
        audio {
            width: 100%;
            height: 45px;
            outline: none;
            border-radius: 25px;
        }
        
        .status-msg {
            font-size: 20px;
            font-weight: bold;
            color: var(--text-inactive);
            text-align: left;
            margin-top: 40px;
        }

        /* МОДАЛЬНОЕ ОКНО ПЛЕЙЛИСТА */
        .playlist-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 15, 22, 0.95);
            backdrop-filter: blur(20px);
            z-index: 100;
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        .playlist-modal.open {
            transform: translateY(0);
        }
        .playlist-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 15px;
        }
        .playlist-header h2 {
            margin: 0;
            font-size: 20px;
        }
        .close-playlist {
            background: var(--btn-bg);
            border: none;
            color: #fff;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-size: 16px;
            cursor: pointer;
        }
        .playlist-items {
            flex-grow: 1;
            overflow-y: auto;
        }
        .playlist-track {
            padding: 12px 15px;
            background: rgba(255,255,255,0.03);
            border-radius: 12px;
            margin-bottom: 10px;
            display: flex;
            flex-direction: column;
            cursor: pointer;
            border: 1px solid transparent;
            transition: 0.2s;
        }
        .playlist-track:active {
            background: rgba(255,255,255,0.08);
        }
        .playlist-track.playing {
            border-color: rgba(255,255,255,0.3);
            background: rgba(255,255,255,0.08);
        }
        .pl-title {
            font-weight: 700;
            font-size: 15px;
            margin-bottom: 3px;
        }
        .pl-artist {
            font-size: 13px;
            color: var(--text-inactive);
        }
    </style>
</head>
<body>

    <div class="header">
        <img class="cover-mini" id="cover-image" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=" alt="cover">
        <div class="track-info">
            <div class="track-title">
                <span id="title-display">Загрузка...</span>
                <span class="explicit-icon">E</span>
            </div>
            <div class="track-artist" id="artist-display">Подключение</div>
        </div>
        <div class="header-actions">
            <!-- Кнопка открытия плейлиста -->
            <button class="icon-btn" id="playlist-btn" title="Мои песни">
                <svg viewBox="0 0 24 24"><path d="M4 10h12v2H4zm0-4h12v2H4zm0 8h8v2H4zm10 0v6l5-3z"/></svg>
            </button>
            <!-- Кнопка скрыть/показать плеер -->
            <button class="icon-btn" id="toggle-player-btn" title="Скрыть/Показать плеер">
                <svg viewBox="0 0 24 24"><path d="M6 10c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm12 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm-6 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>
            </button>
        </div>
    </div>

    <div class="lyrics-container" id="lyrics">
        <div class="status-msg">Ищем текст песни... 🔍</div>
    </div>

    <div class="player-wrapper" id="player-wrap">
        <audio id="audio" controls autoplay></audio>
    </div>

    <!-- Модальное окно плейлиста -->
    <div class="playlist-modal" id="playlist-modal">
        <div class="playlist-header">
            <h2>🎵 Мои песни</h2>
            <button class="close-playlist" id="close-playlist">✕</button>
        </div>
        <div class="playlist-items" id="playlist-items">
            <!-- Сюда динамически добавятся треки -->
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.setHeaderColor('#1a1a24'); 
        tg.setBackgroundColor('#1a1a24');

        const JSONBIN_KEY = "$2a$10$K0t8NaC64RzHdWCbtN.i2.sUpZS28KhFhruBtunwtsz0LB8uEWRsy";

        const audio = document.getElementById('audio');
        const lyricsContainer = document.getElementById('lyrics');
        const titleDisplay = document.getElementById('title-display');
        const artistDisplay = document.getElementById('artist-display');
        const coverImage = document.getElementById('cover-image');
        
        const playerWrap = document.getElementById('player-wrap');
        const togglePlayerBtn = document.getElementById('toggle-player-btn');
        
        const playlistBtn = document.getElementById('playlist-btn');
        const playlistModal = document.getElementById('playlist-modal');
        const closePlaylistBtn = document.getElementById('close-playlist');
        const playlistItemsContainer = document.getElementById('playlist-items');
        
        let lyrics = [];
        let currentActiveIndex = -1;
        const trackId = tg.initDataUnsafe?.start_param;

        // Управление видимостью плеера
        togglePlayerBtn.addEventListener('click', () => {
            playerWrap.classList.toggle('hidden');
        });

        // Открытие/закрытие плейлиста
        playlistBtn.addEventListener('click', () => {
            renderPlaylistUI();
            playlistModal.classList.add('open');
        });
        closePlaylistBtn.addEventListener('click', () => {
            playlistModal.classList.remove('open');
        });

        // Работа с локальным плейлистом в памяти браузера
        function saveTrackToMyPlaylist(track) {
            let myTracks = JSON.parse(localStorage.getItem('my_music_playlist') || '[]');
            // Проверяем, нет ли уже такого трека, чтобы не дублировать
            if (!myTracks.some(t => t.audio === track.audio)) {
                myTracks.unshift(track); // Добавляем в самый верх
                localStorage.setItem('my_music_playlist', JSON.stringify(myTracks));
            }
        }

        function renderPlaylistUI() {
            let myTracks = JSON.parse(localStorage.getItem('my_music_playlist') || '[]');
            playlistItemsContainer.innerHTML = '';

            if (myTracks.length === 0) {
            playlistItemsContainer.innerHTML = '<div style="color:rgba(255,255,255,0.4); text-align:center; margin-top:40px;">Список пуст. Открывайте треки через бота, и они появятся здесь!</div>';
                return;
            }

            myTracks.forEach((track, index) => {
                const item = document.createElement('div');
                item.className = `playlist-track ${audio.src === track.audio ? 'playing' : ''}`;
                item.innerHTML = `
                    <div class="pl-title">${track.title}</div>
                    <div class="pl-artist">${track.artist}</div>
                `;
                item.onclick = () => {
                    playSelectedTrack(track);
                    playlistModal.classList.remove('open');
                };
                playlistItemsContainer.appendChild(item);
            });
        }

        function playSelectedTrack(track) {
            titleDisplay.innerText = track.title;
            artistDisplay.innerText = track.artist;
            audio.src = track.audio;
            audio.play();

            fetchCover(track.title, track.artist);
            fetchLyrics(track.title, track.artist);
        }

        async function loadTrack() {
            if (!trackId) {
                titleDisplay.innerText = "Ошибка";
                artistDisplay.innerText = "Трек не найден";
                lyricsContainer.innerHTML = '<div class="status-msg">Запустите плеер через бота.</div>';
                return;
            }

            try {
                const res = await fetch(`https://api.jsonbin.io/v3/b/${trackId}`, {
                    headers: { "X-Master-Key": JSONBIN_KEY }
                });
                const data = await res.json();
                const track = data.record;

                titleDisplay.innerText = track.title;
                artistDisplay.innerText = track.artist;
                audio.src = track.audio;

                // Сохраняем текущий трек в историю "Мои песни"
                saveTrackToMyPlaylist(track);

                fetchCover(track.title, track.artist);
                fetchLyrics(track.title, track.artist);
            } catch (e) {
                titleDisplay.innerText = "Ошибка";
                artistDisplay.innerText = "Сбой загрузки";
            }
        }

        async function fetchCover(title, artist) {
            try {
                const query = encodeURIComponent(artist + ' ' + title);
                const res = await fetch(`https://itunes.apple.com/search?term=${query}&entity=song&limit=1`);
                const data = await res.json();
                if (data.results && data.results.length > 0) {
                    coverImage.src = data.results[0].artworkUrl100;
                }
            } catch (e) {
                console.log("Обложка не найдена");
            }
        }

        async function fetchLyrics(title, artist) {
            try {
                const response = await fetch(`https://lrclib.net/api/search?track_name=${encodeURIComponent(title)}&artist_name=${encodeURIComponent(artist)}`);
                const data = await response.json();
                if (data && data.length > 0 && data[0].syncedLyrics) {
                    parseLrc(data[0].syncedLyrics);
                    renderLyrics();
                } else {
                    lyricsContainer.innerHTML = '<div class="status-msg">Текст песни не найден 😔</div>';
                }
            } catch (error) {
                lyricsContainer.innerHTML = '<div class="status-msg">Ошибка загрузки текста ❌</div>';
            }
        }

        function parseLrc(lrcText) {
            lyrics = [];
            lrcText.split('\n').forEach(line => {
                const match = /\[(\d{2}):(\d{2}\.\d{2,3})\](.*)/.exec(line);
                if (match && match[3].trim() !== '') {
                    lyrics.push({ time: (parseInt(match[1]) * 60) + parseFloat(match[2]), text: match[3].trim() });
                }
            });
        }

        function renderLyrics() {
            lyricsContainer.innerHTML = '';
            
            const padTop = document.createElement('div');
            padTop.style.height = '35vh';
            lyricsContainer.appendChild(padTop);

            lyrics.forEach((line, index) => {
                const el = document.createElement('div');
                el.className = 'lyric-line';
                el.id = 'line-' + index;
                el.innerText = line.text;
                
                el.onclick = () => {
                    audio.currentTime = line.time;
                    audio.play();
                };
                lyricsContainer.appendChild(el);
            });
            
            const padBot = document.createElement('div');
            padBot.style.height = '50vh';
            lyricsContainer.appendChild(padBot);
            
            requestAnimationFrame(syncLyrics);
        }

        function syncLyrics() {
            if (lyrics.length > 0 && !audio.paused) {
                const LYRIC_OFFSET = 0.45; 
                const currentTime = audio.currentTime + LYRIC_OFFSET;
                
                let activeIndex = -1;
                for (let i = 0; i < lyrics.length; i++) {
                    const isLast = i === lyrics.length - 1;
                    if (currentTime >= lyrics[i].time && (isLast || currentTime < lyrics[i + 1].time)) {
                        activeIndex = i;
                        break;
                    }
                }

                if (activeIndex !== -1 && activeIndex !== currentActiveIndex) {
                    currentActiveIndex = activeIndex;
                    
                    document.querySelectorAll('.lyric-line').forEach(e => e.classList.remove('active'));
                    
                    const activeEl = document.getElementById('line-' + activeIndex);
                    if (activeEl) {
                        activeEl.classList.add('active');
                        activeEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }
                }
            }
            requestAnimationFrame(syncLyrics);
        }

        audio.addEventListener('play', () => {
            requestAnimationFrame(syncLyrics);
        });

        loadTrack();
    </script>
</body>
</html>
