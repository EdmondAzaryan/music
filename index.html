<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Player</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background-color: #121212; color: #ffffff; font-family: sans-serif; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; height: 100vh; box-sizing: border-box; overflow: hidden; }
        .cover { width: 180px; height: 180px; background: linear-gradient(135deg, #1db954, #121212); border-radius: 12px; margin-bottom: 15px; }
        .track-info { text-align: center; margin-bottom: 15px; width: 100%; max-width: 350px; }
        .track-title { font-size: 18px; font-weight: bold; margin-bottom: 5px; }
        .track-artist { font-size: 14px; color: #aaa; }
        .controls { width: 100%; max-width: 350px; margin-bottom: 20px; }
        audio { width: 100%; outline: none; }
        .lyrics-container { flex-grow: 1; width: 100%; max-width: 350px; overflow-y: scroll; text-align: center; scroll-behavior: smooth; padding-bottom: 50px; }
        .lyrics-container::-webkit-scrollbar { display: none; }
        .lyric-line { font-size: 16px; margin: 12px 0; color: #666; transition: all 0.3s ease; }
        .lyric-line.active { color: #1db954; font-size: 22px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="cover"></div>
    <div class="track-info">
        <div class="track-title" id="title-display">Загрузка...</div>
        <div class="track-artist" id="artist-display"></div>
    </div>
    <div class="controls"><audio id="audio" controls autoplay></audio></div>
    <div class="lyrics-container" id="lyrics"></div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const JSONBIN_KEY = "$2a$10$K0t8NaC64RzHdWCbtN.i2.sUpZS28KhFhruBtunwtsz0LB8uEWRsy"; // $2a$10$...

        const audio = document.getElementById('audio');
        const lyricsContainer = document.getElementById('lyrics');
        const titleDisplay = document.getElementById('title-display');
        const artistDisplay = document.getElementById('artist-display');
        let lyrics = [];

        // Читаем ID песни из параметра startapp
        const trackId = tg.initDataUnsafe?.start_param;

        async function loadTrack() {
            if (!trackId) {
                titleDisplay.innerText = "Ошибка: трек не найден";
                return;
            }

            try {
                // Запрашиваем данные о треке из бесплатного облака
                const res = await fetch(`https://api.jsonbin.io/v3/b/${trackId}`, {
                    headers: { "X-Master-Key": JSONBIN_KEY }
                });
                const data = await res.json();
                const track = data.record;

                titleDisplay.innerText = track.title;
                artistDisplay.innerText = track.artist;
                audio.src = track.audio;

                fetchLyrics(track.title, track.artist);
            } catch (e) {
                titleDisplay.innerText = "Ошибка загрузки трека";
            }
        }

        async function fetchLyrics(title, artist) {
            lyricsContainer.innerHTML = '<div class="lyric-line">Ищем текст песни... 🔍</div>';
            try {
                const response = await fetch(`https://lrclib.net/api/search?track_name=${encodeURIComponent(title)}&artist_name=${encodeURIComponent(artist)}`);
                const data = await response.json();
                if (data && data.length > 0 && data[0].syncedLyrics) {
                    parseLrc(data[0].syncedLyrics);
                    renderLyrics();
                } else {
                    lyricsContainer.innerHTML = '<div class="lyric-line">Текст песни не найден 😔</div>';
                }
            } catch (error) {
                lyricsContainer.innerHTML = '<div class="lyric-line">Ошибка загрузки текста ❌</div>';
            }
        }

        function parseLrc(lrcText) {
            lyrics = [];
            lrcText.split('\n').forEach(line => {
                const match = /\[(\d{2}):(\d{2}\.\d{2,3})\](.*)/.exec(line);
                if (match) {
                    lyrics.push({ time: (parseInt(match[1]) * 60) + parseFloat(match[2]), text: match[3].trim() });
                }
            });
        }

        function renderLyrics() {
            lyricsContainer.innerHTML = '';
            lyrics.forEach((line, index) => {
                const el = document.createElement('div');
                el.className = 'lyric-line';
                el.id = 'line-' + index;
                el.innerText = line.text;
                el.onclick = () => audio.currentTime = line.time;
                lyricsContainer.appendChild(el);
            });
        }

        audio.addEventListener('timeupdate', () => {
            if (lyrics.length === 0) return;
            const currentTime = audio.currentTime;
            for (let i = 0; i < lyrics.length; i++) {
                const isLast = i === lyrics.length - 1;
                if (currentTime >= lyrics[i].time && (isLast || currentTime < lyrics[i + 1].time)) {
                    const el = document.getElementById('line-' + i);
                    if (el && !el.classList.contains('active')) {
                        document.querySelectorAll('.lyric-line').forEach(e => e.classList.remove('active'));
                        el.classList.add('active');
                        el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }
                    break;
                }
            }
        });

        loadTrack();
    </script>
</body>
</html>
