<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Music Player</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #1a1a24;
            --text-active: #ffffff;
            --text-inactive: rgba(255, 255, 255, 0.35);
            --btn-bg: rgba(255, 255, 255, 0.1);
        }
        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at 50% 0%, #323245 0%, var(--bg-color) 70%);
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-sizing: border-box;
        }

        /* --- ОСНОВНОЙ ЭКРАН С ТЕКСТОМ (ОТКРЫВАЕТСЯ СРАЗУ) --- */
        .full-view {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            z-index: 40;
        }

        .header {
            display: flex;
            align-items: center;
            padding: 20px 20px 10px 20px;
            z-index: 10;
        }
        .cover-mini {
            width: 55px;
            height: 55px;
            border-radius: 12px;
            background: linear-gradient(135deg, #444, #111);
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            flex-shrink: 0;
            object-fit: cover;
        }
        .track-info {
            display: flex;
            flex-direction: column;
            justify-content: center;
            overflow: hidden;
            margin-left: 15px;
            flex-grow: 1;
        }
        .track-title {
            font-size: 17px;
            font-weight: 700;
            margin-bottom: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .explicit-icon {
            background-color: rgba(255,255,255,0.2);
            color: #fff;
            font-size: 9px;
            font-weight: bold;
            padding: 1px 4px;
            border-radius: 3px;
        }
        .track-artist {
            font-size: 14px;
            color: var(--text-inactive);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .header-actions {
            display: flex;
            gap: 6px;
            margin-left: 8px;
        }
        .icon-btn {
            background: var(--btn-bg);
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(5px);
            transition: 0.2s;
        }
        .icon-btn:active {
            background: rgba(255,255,255,0.2);
            transform: scale(0.9);
        }
        .icon-btn svg {
            fill: #fff;
            width: 18px;
            height: 18px;
        }

        /* Контейнер с текстом песни */
        .lyrics-container {
            flex-grow: 1;
            padding: 20px;
            padding-bottom: 150px;
            overflow-y: auto;
            scroll-behavior: smooth;
            display: flex;
            flex-direction: column;
            mask-image: linear-gradient(to bottom, transparent 0%, black 15%, black 75%, transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 15%, black 75%, transparent 100%);
        }
        .lyrics-container::-webkit-scrollbar { display: none; }
        
        .lyric-line {
            font-size: 26px;
            font-weight: 700;
            color: var(--text-inactive);
            margin: 12px 0;
            line-height: 1.3;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            filter: blur(1.5px);
            transform-origin: left center;
            cursor: pointer;
            text-align: left;
        }
        .lyric-line.active {
            font-size: 38px;
            color: var(--text-active);
            filter: blur(0);
            margin: 25px 0;
            text-shadow: 0 4px 15px rgba(255,255,255,0.15);
        }

        /* Выдвижной плеер внизу */
        .player-wrapper {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 20px;
            background: linear-gradient(to top, rgba(26,26,36,1) 30%, rgba(26,26,36,0) 100%);
            box-sizing: border-box;
            z-index: 10;
            transition: transform 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        .player-wrapper.hidden {
            transform: translateY(100%);
        }


        /* --- КОМПАКТНЫЙ ПЛЕЕР-КАРТОЧКА (СКРЫТ ПО УМОЛЧАНИЮ, ПОЯВЛЯЕТСЯ ПО КЛИКУ) --- */
        .compact-view {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none; /* Скрыто по умолчанию */
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #000000;
            z-index: 50;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .compact-view.show {
            display: flex;
            opacity: 1;
        }

        .ios-card {
            width: 88%;
            background: rgba(28, 28, 35, 0.85);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 22px;
            padding: 16px;
            box-sizing: border-box;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            margin-bottom: 20px;
        }

        .ios-player-top {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 14px;
        }

        .ios-cover {
            width: 52px;
            height: 52px;
            border-radius: 12px;
            object-fit: cover;
            background: #222;
        }

        .ios-meta {
            flex-grow: 1;
            overflow: hidden;
        }

        .ios-title {
            font-size: 16px;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 2px;
        }

        .ios-artist {
            font-size: 13px;
            color: var(--text-inactive);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .progress-container {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 14px;
        }

        .time-text {
            font-size: 11px;
            color: var(--text-inactive);
            width: 35px;
            text-align: center;
            flex-shrink: 0;
            font-variant-numeric: tabular-nums;
        }

        .progress-bar {
            flex-grow: 1;
            appearance: none;
            -webkit-appearance: none;
            background: rgba(255, 255, 255, 0.2);
            height: 4px;
            border-radius: 2px;
            outline: none;
            cursor: pointer;
        }

        .progress-bar::-webkit-slider-thumb {
            appearance: none;
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ffffff;
            cursor: pointer;
        }

        .ios-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 35px;
        }

        .ctrl-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .ctrl-btn svg {
            fill: #ffffff;
            width: 26px;
            height: 26px;
        }

        .ctrl-btn.play-pause svg {
            width: 34px;
            height: 34px;
        }

        .fullscreen-trigger-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: #ffffff;
            padding: 10px 24px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: 0.2s;
        }
        .fullscreen-trigger-btn:active {
            transform: scale(0.95);
            background: rgba(255, 255, 255, 0.2);
        }


        /* Модальное окно "Мои песни" (Звёздочка) */
        .playlist-modal {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(15, 15, 22, 0.95);
            backdrop-filter: blur(20px);
            z-index: 100;
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        .playlist-modal.open { transform: translateY(0); }
        .playlist-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 15px;
        }
        .playlist-header h2 { margin: 0; font-size: 20px; }
        .close-playlist {
            background: var(--btn-bg);
            border: none; color: #fff;
            width: 32px; height: 32px;
            border-radius: 50%; font-size: 16px; cursor: pointer;
        }
        .playlist-items { flex-grow: 1; overflow-y: auto; }
        .playlist-track {
            padding: 12px 15px;
            background: rgba(255,255,255,0.03);
            border-radius: 12px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid transparent;
            transition: 0.2s;
        }
        .playlist-track.playing {
            border-color: rgba(255,255,255,0.3);
            background: rgba(255,255,255,0.08);
        }
        .track-meta { flex-grow: 1; overflow: hidden; cursor: pointer; }
        .pl-title { font-weight: 700; font-size: 15px; margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .pl-artist { font-size: 13px; color: var(--text-inactive); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .delete-track-btn {
            background: none; border: none; color: rgba(255, 255, 255, 0.4);
            font-size: 16px; cursor: pointer; padding: 8px; border-radius: 8px; transition: 0.2s; flex-shrink: 0;
        }
        .delete-track-btn:active { color: #ff3b30; background: rgba(255, 59, 48, 0.15); }
        
        audio { display: none; }
        
        .status-msg {
            font-size: 20px;
            font-weight: bold;
            color: var(--text-inactive);
            text-align: left;
            margin-top: 40px;
        }
    </style>
</head>
<body>

    <!-- ОСНОВНОЙ ЭКРАН С ТЕКСТОМ (ОТКРЫВАЕТСЯ СРАЗУ) -->
    <div class="full-view" id="full-view">
        <div class="header">
            <img class="cover-mini" id="cover-image" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=" alt="cover">
            <div class="track-info">
                <div class="track-title">
                    <span id="title-display">Загрузка...</span>
                    <span class="explicit-icon">E</span>
                </div>
                <div class="track-artist" id="artist-display">Подключение</div>
            </div>
            <div class="header-actions">
                <!-- Кнопка в шапке для переключения в режим карточки -->
                <button class="icon-btn" id="switch-to-card-btn" title="Компактный плеер">
                    <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V5h14v14z"/></svg>
                </button>
                <!-- Звёздочка (Мои песни) -->
                <button class="icon-btn" id="fav-btn" title="Мои песни">
                    <svg viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
                </button>
                <!-- Три точки (скрыть/показать нижний плеер) -->
                <button class="icon-btn" id="toggle-player-btn" title="Опции">
                    <svg viewBox="0 0 24 24"><path d="M6 10c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm12 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm-6 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>
                </button>
            </div>
        </div>

        <div class="lyrics-container" id="lyrics">
            <div class="status-msg">Ищем текст песни... 🔍</div>
        </div>

        <div class="player-wrapper" id="player-wrap">
            <div class="progress-container">
                <span class="time-text" id="full-current-time">0:00</span>
                <input type="range" class="progress-bar" id="full-progress-bar" value="0" min="0" max="100" step="0.1">
                <span class="time-text" id="full-duration-time">0:00</span>
            </div>
            <div class="ios-controls">
                <button class="ctrl-btn" id="full-btn-prev">
                    <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
                </button>
                <button class="ctrl-btn play-pause" id="full-btn-play-pause">
                    <svg id="full-play-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                </button>
                <button class="ctrl-btn" id="full-btn-next">
                    <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
                </button>
            </div>
        </div>
    </div>


    <!-- КОМПАКТНЫЙ ПЛЕЕР-КАРТОЧКА (ПОЯВЛЯЕТСЯ ТОЛЬКО ПО КЛИКУ) -->
    <div class="compact-view" id="compact-view">
        <div class="ios-card">
            <div class="ios-player-top">
                <img class="ios-cover" id="card-cover" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=" alt="cover">
                <div class="ios-meta">
                    <div class="ios-title" id="card-title">Загрузка...</div>
                    <div class="ios-artist" id="card-artist">Исполнитель</div>
                </div>
            </div>

            <div class="progress-container">
                <span class="time-text" id="card-current-time">0:00</span>
                <input type="range" class="progress-bar" id="card-progress-bar" value="0" min="0" max="100" step="0.1">
                <span class="time-text" id="card-duration-time">0:00</span>
            </div>

            <div class="ios-controls">
                <button class="ctrl-btn" id="card-btn-prev">
                    <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
                </button>
                <button class="ctrl-btn play-pause" id="card-btn-play-pause">
                    <svg id="card-play-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                </button>
                <button class="ctrl-btn" id="card-btn-next">
                    <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
                </button>
            </div>
        </div>

        <button class="fullscreen-trigger-btn" id="back-to-lyrics-btn">
            📱 На весь экран
        </button>
    </div>


    <!-- Модальное окно "Мои песни" (Звёздочка) -->
    <div class="playlist-modal" id="playlist-modal">
        <div class="playlist-header">
            <h2>⭐ Мои песни</h2>
            <button class="close-playlist" id="close-playlist">✕</button>
        </div>
        <div class="playlist-items" id="playlist-items"></div>
    </div>

    <!-- Общий аудио элемент -->
    <audio id="audio" autoplay></audio>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.setHeaderColor('#1a1a24'); 
        tg.setBackgroundColor('#1a1a24');

        const JSONBIN_KEY = "$2a$10$K0t8NaC64RzHdWCbtN.i2.sUpZS28KhFhruBtunwtsz0LB8uEWRsy";

        const audio = document.getElementById('audio');
        const lyricsContainer = document.getElementById('lyrics');
        
        // Переключения режимов
        const compactView = document.getElementById('compact-view');
        const switchToCardBtn = document.getElementById('switch-to-card-btn');
        const backToLyricsBtn = document.getElementById('back-to-lyrics-btn');
        
        const togglePlayerBtn = document.getElementById('toggle-player-btn');
        const favBtn = document.getElementById('fav-btn');
        const playerWrap = document.getElementById('player-wrap');

        // Модалка плейлиста
        const playlistModal = document.getElementById('playlist-modal');
        const closePlaylistBtn = document.getElementById('close-playlist');
        const playlistItemsContainer = document.getElementById('playlist-items');
        
        // Карточка
        const cardTitle = document.getElementById('card-title');
        const cardArtist = document.getElementById('card-artist');
        const cardCover = document.getElementById('card-cover');
        const cardProgressBar = document.getElementById('card-progress-bar');
        const cardCurrentTime = document.getElementById('card-current-time');
        const cardDurationTime = document.getElementById('card-duration-time');
        const cardBtnPlayPause = document.getElementById('card-btn-play-pause');
        const cardPlayIcon = document.getElementById('card-play-icon');
        const cardBtnPrev = document.getElementById('card-btn-prev');
        const cardBtnNext = document.getElementById('card-btn-next');

        // Полноэкранный режим с текстом
        const titleDisplay = document.getElementById('title-display');
        const artistDisplay = document.getElementById('artist-display');
        const coverImage = document.getElementById('cover-image');
        const fullProgressBar = document.getElementById('full-progress-bar');
        const fullCurrentTime = document.getElementById('full-current-time');
        const fullDurationTime = document.getElementById('full-duration-time');
        const fullBtnPlayPause = document.getElementById('full-btn-play-pause');
        const fullPlayIcon = document.getElementById('full-play-icon');
        const fullBtnPrev = document.getElementById('full-btn-prev');
        const fullBtnNext = document.getElementById('full-btn-next');

        let lyrics = [];
        let currentActiveIndex = -1;
        let timeOffset = 0.45;
        const trackId = tg.initDataUnsafe?.start_param;

        // Открытие карточки по клику на кнопку в шапке
        switchToCardBtn.addEventListener('click', () => {
            compactView.classList.add('show');
        });
        // Возврат к тексту по клику на кнопку "На весь экран"
        backToLyricsBtn.addEventListener('click', () => {
            compactView.classList.remove('show');
        });

        // Кнопка "Три точки" (скрыть/показать нижний плеер в режиме текста)
        togglePlayerBtn.addEventListener('click', () => {
            playerWrap.classList.toggle('hidden');
        });

        // Кнопка "Звёздочка" (открытие плейлиста)
        favBtn.addEventListener('click', () => {
            renderPlaylistUI();
            playlistModal.classList.add('open');
        });
        closePlaylistBtn.addEventListener('click', () => {
            playlistModal.classList.remove('open');
        });

        // Воспроизведение / Пауза
        function togglePlay() {
            if (audio.paused) {
                audio.play();
            } else {
                audio.pause();
            }
        }

        cardBtnPlayPause.addEventListener('click', togglePlay);
        fullBtnPlayPause.addEventListener('click', togglePlay);

        audio.addEventListener('play', () => {
            const pauseSvg = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
            cardPlayIcon.innerHTML = pauseSvg;
            fullPlayIcon.innerHTML = pauseSvg;
            requestAnimationFrame(syncLyrics);
        });

        audio.addEventListener('pause', () => {
            const playSvg = '<path d="M8 5v14l11-7z"/>';
            cardPlayIcon.innerHTML = playSvg;
            fullPlayIcon.innerHTML = playSvg;
        });

        // Перемотка
        cardBtnPrev.addEventListener('click', () => { audio.currentTime = Math.max(0, audio.currentTime - 10); });
        cardBtnNext.addEventListener('click', () => { audio.currentTime = Math.min(audio.duration || 0, audio.currentTime + 10); });
        fullBtnPrev.addEventListener('click', () => { audio.currentTime = Math.max(0, audio.currentTime - 10); });
        fullBtnNext.addEventListener('click', () => { audio.currentTime = Math.min(audio.duration || 0, audio.currentTime + 10); });

        // Синхронизация времени на обоих экранах
        audio.addEventListener('timeupdate', () => {
            if (!isNaN(audio.duration)) {
                const progressPercent = (audio.currentTime / audio.duration) * 100;
                cardProgressBar.value = progressPercent;
                fullProgressBar.value = progressPercent;
                
                const timeStr = formatTime(audio.currentTime);
                const durStr = formatTime(audio.duration);
                
                cardCurrentTime.innerText = timeStr;
                fullCurrentTime.innerText = timeStr;
                cardDurationTime.innerText = durStr;
                fullDurationTime.innerText = durStr;
            }
        });

        cardProgressBar.addEventListener('input', () => {
            if (!isNaN(audio.duration)) { audio.currentTime = (cardProgressBar.value / 100) * audio.duration; }
        });
        fullProgressBar.addEventListener('input', () => {
            if (!isNaN(audio.duration)) { audio.currentTime = (fullProgressBar.value / 100) * audio.duration; }
        });

        function formatTime(seconds) {
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        }

        // Сохранение в Мои песни
        function saveTrackToMyPlaylist(track) {
            let myTracks = JSON.parse(localStorage.getItem('my_music_playlist') || '[]');
            if (!myTracks.some(t => t.audio === track.audio)) {
                myTracks.unshift(track);
                localStorage.setItem('my_music_playlist', JSON.stringify(myTracks));
            }
        }

        function removeTrackFromPlaylist(index, event) {
            event.stopPropagation();
            let myTracks = JSON.parse(localStorage.getItem('my_music_playlist') || '[]');
            myTracks.splice(index, 1);
            localStorage.setItem('my_music_playlist', JSON.stringify(myTracks));
            renderPlaylistUI();
        }

        function renderPlaylistUI() {
            let myTracks = JSON.parse(localStorage.getItem('my_music_playlist') || '[]');
            playlistItemsContainer.innerHTML = '';

            if (myTracks.length === 0) {
                playlistItemsContainer.innerHTML = '<div style="color:rgba(255,255,255,0.4); text-align:center; margin-top:40px;">Список пуст. Открывайте треки через бота!</div>';
                return;
            }

            myTracks.forEach((track, index) => {
                const item = document.createElement('div');
                item.className = `playlist-track ${audio.src === track.audio ? 'playing' : ''}`;
                
                const metaDiv = document.createElement('div');
                metaDiv.className = 'track-meta';
                metaDiv.innerHTML = `<div class="pl-title">${track.title}</div><div class="pl-artist">${track.artist}</div>`;
                metaDiv.onclick = () => { playSelectedTrack(track); playlistModal.classList.remove('open'); };

                const deleteBtn = document.createElement('button');
                deleteBtn.className = 'delete-track-btn';
                deleteBtn.innerHTML = '✕';
                deleteBtn.onclick = (e) => removeTrackFromPlaylist(index, e);

                item.appendChild(metaDiv);
                item.appendChild(deleteBtn);
                playlistItemsContainer.appendChild(item);
            });
        }

        function playSelectedTrack(track) {
            cardTitle.innerText = track.title;
            cardArtist.innerText = track.artist;
            titleDisplay.innerText = track.title;
            artistDisplay.innerText = track.artist;
            audio.src = track.audio;
            audio.play();

            fetchCover(track.title, track.artist);
            fetchLyrics(track.title, track.artist);
        }

        async function loadTrack() {
            if (!trackId) {
                cardTitle.innerText = "Ошибка";
                cardArtist.innerText = "Трек не найден";
                return;
            }

            try {
                const res = await fetch(`https://api.jsonbin.io/v3/b/${trackId}`, {
                    headers: { "X-Master-Key": JSONBIN_KEY }
                });
                const data = await res.json();
                const track = data.record;

                cardTitle.innerText = track.title;
                cardArtist.innerText = track.artist;
                titleDisplay.innerText = track.title;
                artistDisplay.innerText = track.artist;
                audio.src = track.audio;

                saveTrackToMyPlaylist(track);

                fetchCover(track.title, track.artist);
                fetchLyrics(track.title, track.artist);
            } catch (e) {
                cardTitle.innerText = "Ошибка";
                cardArtist.innerText = "Сбой загрузки";
            }
        }

        async function fetchCover(title, artist) {
            try {
                const query = encodeURIComponent(artist + ' ' + title);
                const res = await fetch(`https://itunes.apple.com/search?term=${query}&entity=song&limit=1`);
                const data = await res.json();
                if (data.results && data.results.length > 0) {
                    const artwork = data.results[0].artworkUrl100;
                    cardCover.src = artwork;
                    coverImage.src = artwork;
                }
            } catch (e) {}
        }

        async function fetchLyrics(title, artist) {
            try {
                let response = await fetch(`https://lrclib.net/api/search?q=${encodeURIComponent(artist + ' ' + title)}`);
                let data = await response.json();
                let itemWithLyrics = data.find(item => item.syncedLyrics && item.syncedLyrics.trim() !== '');

                if (!itemWithLyrics) {
                    const cleanTitle = title.replace(/[\(\[].*?[\)\]]/g, '').trim();
                    response = await fetch(`https://lrclib.net/api/search?q=${encodeURIComponent(cleanTitle)}`);
                    data = await response.json();
                    itemWithLyrics = data.find(item => item.syncedLyrics && item.syncedLyrics.trim() !== '');
                }

                if (itemWithLyrics) {
                    parseLrc(itemWithLyrics.syncedLyrics);
                    renderLyrics();
                } else {
                    lyricsContainer.innerHTML = '<div class="status-msg">Текст песни не найден 😔</div>';
                }
            } catch (error) {
                lyricsContainer.innerHTML = '<div class="status-msg">Ошибка загрузки текста ❌</div>';
            }
        }

        function parseLrc(lrcText) {
            lyrics = [];
            lrcText.split('\n').forEach(line => {
                const match = /\[(\d{2}):(\d{2}\.\d{2,3})\](.*)/.exec(line);
                if (match && match[3].trim() !== '') {
                    lyrics.push({ time: (parseInt(match[1]) * 60) + parseFloat(match[2]), text: match[3].trim() });
                }
            });
        }

        function renderLyrics() {
            lyricsContainer.innerHTML = '';
            const padTop = document.createElement('div'); padTop.style.height = '35vh'; lyricsContainer.appendChild(padTop);

            lyrics.forEach((line, index) => {
                const el = document.createElement('div');
                el.className = 'lyric-line';
                el.id = 'line-' + index;
                el.innerText = line.text;
                el.onclick = () => { audio.currentTime = line.time; audio.play(); };
                lyricsContainer.appendChild(el);
            });
            
            const padBot = document.createElement('div'); padBot.style.height = '50vh'; lyricsContainer.appendChild(padBot);
            requestAnimationFrame(syncLyrics);
        }

        function syncLyrics() {
            if (lyrics.length > 0 && !audio.paused) {
                const currentTime = audio.currentTime + timeOffset;
                let activeIndex = -1;
                for (let i = 0; i < lyrics.length; i++) {
                    const isLast = i === lyrics.length - 1;
                    if (currentTime >= lyrics[i].time && (isLast || currentTime < lyrics[i + 1].time)) {
                        activeIndex = i;
                        break;
                    }
                }

                if (activeIndex !== -1 && activeIndex !== currentActiveIndex) {
                    currentActiveIndex = activeIndex;
                    document.querySelectorAll('.lyric-line').forEach(e => e.classList.remove('active'));
                    const activeEl = document.getElementById('line-' + activeIndex);
                    if (activeEl) {
                        activeEl.classList.add('active');
                        activeEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }
                }
            }
            requestAnimationFrame(syncLyrics);
        }

        loadTrack();
    </script>
</body>
</html>
