<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Music Player</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #1a1a24;
            --text-active: #ffffff;
            --text-inactive: rgba(255, 255, 255, 0.35);
            --btn-bg: rgba(255, 255, 255, 0.1);
        }
        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at 50% 0%, #323245 0%, var(--bg-color) 70%);
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-sizing: border-box;
        }
        
        .header {
            display: flex;
            align-items: center;
            padding: 20px 20px 10px 20px;
            z-index: 10;
        }
        .cover-mini {
            width: 55px;
            height: 55px;
            border-radius: 12px;
            background: linear-gradient(135deg, #444, #111);
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            flex-shrink: 0;
            object-fit: cover;
        }
        .track-info {
            display: flex;
            flex-direction: column;
            justify-content: center;
            overflow: hidden;
            margin-left: 15px;
            flex-grow: 1;
        }
        .track-title {
            font-size: 17px;
            font-weight: 700;
            margin-bottom: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .explicit-icon {
            background-color: rgba(255,255,255,0.2);
            color: #fff;
            font-size: 9px;
            font-weight: bold;
            padding: 1px 4px;
            border-radius: 3px;
        }
        .track-artist {
            font-size: 14px;
            color: var(--text-inactive);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .header-actions {
            display: flex;
            gap: 8px;
            margin-left: 10px;
        }
        .icon-btn {
            background: var(--btn-bg);
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(5px);
            transition: 0.2s;
        }
        .icon-btn:active {
            background: rgba(255,255,255,0.2);
            transform: scale(0.9);
        }
        .icon-btn svg {
            fill: #fff;
            width: 18px;
            height: 18px;
        }

        .lyrics-container {
            flex-grow: 1;
            padding: 20px;
            padding-bottom: 150px;
            padding-top: 20px;
            overflow-y: auto;
            scroll-behavior: smooth;
            display: flex;
            flex-direction: column;
            mask-image: linear-gradient(to bottom, transparent 0%, black 15%, black 75%, transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 15%, black 75%, transparent 100%);
        }
        .lyrics-container::-webkit-scrollbar { display: none; }
        
        .lyric-line {
            font-size: 26px;
            font-weight: 700;
            color: var(--text-inactive);
            margin: 12px 0;
            line-height: 1.3;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            filter: blur(1.5px);
            transform-origin: left center;
            cursor: pointer;
            text-align: left;
        }
        .lyric-line.active {
            font-size: 38px;
            color: var(--text-active);
            filter: blur(0);
            margin: 25px 0;
            text-shadow: 0 4px 15px rgba(255,255,255,0.15);
        }

        .player-wrapper {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 20px;
            background: linear-gradient(to top, rgba(26,26,36,1) 30%, rgba(26,26,36,0) 100%);
            box-sizing: border-box;
            z-index: 10;
            transition: transform 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        .player-wrapper.hidden { transform: translateY(100%); }
        
        audio {
            width: 100%;
            height: 45px;
            outline: none;
            border-radius: 25px;
        }
        
        .status-msg {
            font-size: 20px;
            font-weight: bold;
            color: var(--text-inactive);
            text-align: left;
            margin-top: 40px;
        }
    </style>
</head>
<body>

    <div class="header">
        <img class="cover-mini" id="cover-image" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=" alt="cover">
        <div class="track-info">
            <div class="track-title">
                <span id="title-display">Загрузка...</span>
                <span class="explicit-icon">E</span>
            </div>
            <div class="track-artist" id="artist-display">Подключение</div>
        </div>
        <div class="header-actions">
            <button class="icon-btn">
                <svg viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
            </button>
            <button class="icon-btn" id="toggle-player-btn" title="Скрыть/Показать плеер">
                <svg viewBox="0 0 24 24"><path d="M6 10c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm12 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm-6 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>
            </button>
        </div>
    </div>

    <div class="lyrics-container" id="lyrics">
        <div class="status-msg">Ищем текст песни... 🔍</div>
    </div>

    <div class="player-wrapper" id="player-wrap">
        <audio id="audio" controls autoplay crossorigin="anonymous"></audio>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.setHeaderColor('#1a1a24'); 
        tg.setBackgroundColor('#1a1a24');

        const JSONBIN_KEY = "$2a$10$K0t8NaC64RzHdWCbtN.i2.sUpZS28KhFhruBtunwtsz0LB8uEWRsy";

        const audio = document.getElementById('audio');
        const lyricsContainer = document.getElementById('lyrics');
        const titleDisplay = document.getElementById('title-display');
        const artistDisplay = document.getElementById('artist-display');
        const coverImage = document.getElementById('cover-image');
        const playerWrap = document.getElementById('player-wrap');
        const togglePlayerBtn = document.getElementById('toggle-player-btn');
        
        let lyrics = [];
        let currentActiveIndex = -1;
        const trackId = tg.initDataUnsafe?.start_param;

        // ===== АВТО-СИНХРОНИЗАЦИЯ =====
        // Динамический offset, вычисляется один раз для каждого трека
        // на основе анализа громкости аудио (onset detection).
        let autoOffset = 0;
        let autoOffsetReady = false;
        let audioContext = null;
        let analyser = null;
        let sourceNode = null;

        // Кэш уже рассчитанных offset'ов (чтобы не пересчитывать повторно)
        const OFFSET_CACHE_KEY = 'lyric_auto_offset_v1_' + (trackId || 'default');
        const cachedOffset = localStorage.getItem(OFFSET_CACHE_KEY);
        if (cachedOffset !== null) {
            autoOffset = parseFloat(cachedOffset) || 0;
            autoOffsetReady = true;
        }

        togglePlayerBtn.addEventListener('click', () => {
            playerWrap.classList.toggle('hidden');
        });

        async function loadTrack() {
            if (!trackId) {
                titleDisplay.innerText = "Ошибка";
                artistDisplay.innerText = "Трек не найден";
                lyricsContainer.innerHTML = '<div class="status-msg">Запустите плеер через бота.</div>';
                return;
            }

            try {
                const res = await fetch(`https://api.jsonbin.io/v3/b/${trackId}`, {
                    headers: { "X-Master-Key": JSONBIN_KEY }
                });
                const data = await res.json();
                const track = data.record;

                titleDisplay.innerText = track.title;
                artistDisplay.innerText = track.artist;
                audio.src = track.audio;

                fetchCover(track.title, track.artist);
                fetchLyrics(track.title, track.artist);
            } catch (e) {
                titleDisplay.innerText = "Ошибка";
                artistDisplay.innerText = "Сбой загрузки";
            }
        }

        async function fetchCover(title, artist) {
            try {
                const query = encodeURIComponent(artist + ' ' + title);
                const res = await fetch(`https://itunes.apple.com/search?term=${query}&entity=song&limit=1`);
                const data = await res.json();
                if (data.results && data.results.length > 0) {
                    coverImage.src = data.results[0].artworkUrl100;
                }
            } catch (e) { console.log("Обложка не найдена"); }
        }

        async function fetchLyrics(title, artist) {
            try {
                const response = await fetch(`https://lrclib.net/api/search?track_name=${encodeURIComponent(title)}&artist_name=${encodeURIComponent(artist)}`);
                const data = await response.json();
                if (data && data.length > 0 && data[0].syncedLyrics) {
                    parseLrc(data[0].syncedLyrics);
                    renderLyrics();
                } else {
                    lyricsContainer.innerHTML = '<div class="status-msg">Текст песни не найден 😔</div>';
                }
            } catch (error) {
                lyricsContainer.innerHTML = '<div class="status-msg">Ошибка загрузки текста ❌</div>';
            }
        }

        function parseLrc(lrcText) {
            lyrics = [];
            lrcText.split('\n').forEach(line => {
                const match = /\[(\d{2}):(\d{2}\.\d{2,3})\](.*)/.exec(line);
                if (match && match[3].trim() !== '') {
                    lyrics.push({ time: (parseInt(match[1]) * 60) + parseFloat(match[2]), text: match[3].trim() });
                }
            });
        }

        function renderLyrics() {
            lyricsContainer.innerHTML = '';
            
            const padTop = document.createElement('div');
            padTop.style.height = '35vh';
            lyricsContainer.appendChild(padTop);

            lyrics.forEach((line, index) => {
                const el = document.createElement('div');
                el.className = 'lyric-line';
                el.id = 'line-' + index;
                el.innerText = line.text;
                el.onclick = () => {
                    audio.currentTime = line.time - autoOffset;
                    audio.play();
                };
                lyricsContainer.appendChild(el);
            });
            
            const padBot = document.createElement('div');
            padBot.style.height = '50vh';
            lyricsContainer.appendChild(padBot);
            
            requestAnimationFrame(syncLyrics);
        }

        // ============ АВТО-КАЛИБРОВКА ============
        // Анализируем аудио поток: ищем первую "громкую" точку (вокал/бит)
        // после начала трека. Это и будет реальное время старта первой строки.
        async function autoCalibrate() {
            if (autoOffsetReady || lyrics.length === 0) return;

            try {
                if (!audioContext) {
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    sourceNode = audioContext.createMediaElementSource(audio);
                    analyser = audioContext.createAnalyser();
                    analyser.fftSize = 2048;
                    sourceNode.connect(analyser);
                    analyser.connect(audioContext.destination);
                }
                if (audioContext.state === 'suspended') {
                    await audioContext.resume();
                }

                const bufferLength = analyser.frequencyBinCount;
                const dataArray = new Uint8Array(bufferLength);

                // Ждём первые 15 секунд воспроизведения
                // Каждые 50мс меряем громкость, ищем момент стабильного "громкого" сигнала
                const startCheckTime = performance.now();
                const samples = [];
                const sampleInterval = 50; // ms

                // Храним временную метку старта для преобразования
                // в время аудио
                const initialAudioTime = audio.currentTime;

                let firstLoudMoment = null;
                let loudCount = 0;

                const checkLoudness = () => {
                    if (autoOffsetReady) return;
                    if (audio.paused || audio.ended) {
                        if (!firstLoudMoment) setTimeout(checkLoudness, 100);
                        return;
                    }

                    analyser.getByteFrequencyData(dataArray);
                    // Средняя громкость в спектре
                    let sum = 0;
                    for (let i = 0; i < bufferLength; i++) sum += dataArray[i];
                    const avg = sum / bufferLength;

                    const now = performance.now();
                    samples.push({ t: audio.currentTime, v: avg });

                    // Порог "громко" — эмпирически 18-25 для речи/вокала
                    if (avg > 22) {
                        loudCount++;
                        if (!firstLoudMoment && loudCount >= 2) {
                            firstLoudMoment = audio.currentTime;
                        }
                    } else {
                        loudCount = 0;
                    }

                    // Если прошло 20 секунд, а громкого так и не нашли — стоп
                    if (audio.currentTime > 20 || (firstLoudMoment && audio.currentTime - firstLoudMoment > 1)) {
                        finishCalibration(firstLoudMoment, samples);
                        return;
                    }

                    setTimeout(checkLoudness, sampleInterval);
                };

                setTimeout(checkLoudness, 300);
            } catch (e) {
                console.warn('Авто-калибровка недоступна:', e);
                // Fallback: offset = 0
                autoOffset = 0;
                autoOffsetReady = true;
            }
        }

        function finishCalibration(firstLoudMoment, samples) {
            if (autoOffsetReady) return;

            // Если громкий момент найден — используем его
            if (firstLoudMoment && lyrics[0]) {
                // Первая строка должна подсветиться ровно тогда,
                // когда пошёл вокал. offset = (время вокала) − (время первой строки в LRC)
                autoOffset = firstLoudMoment - lyrics[0].time;
            } else {
                // Fallback: считаем, что intro длится ~ lyrics[0].time секунд
                // Значит offset = 0 (LRC уже учитывает интро)
                autoOffset = 0;
            }

            // Ограничим разумным диапазоном
            autoOffset = Math.max(-15, Math.min(15, autoOffset));
            // Округлим до 0.05 секунды
            autoOffset = Math.round(autoOffset * 20) / 20;

            autoOffsetReady = true;
            localStorage.setItem(OFFSET_CACHE_KEY, autoOffset);
            currentActiveIndex = -1;

            console.log('🎯 Авто-offset:', autoOffset.toFixed(2), 'сек');
        }

        // ============ СИНХРОНИЗАЦИЯ ТЕКСТА ============
        function syncLyrics() {
            if (lyrics.length > 0 && !audio.paused && autoOffsetReady) {
                const currentTime = audio.currentTime + autoOffset;

                let activeIndex = -1;
                for (let i = 0; i < lyrics.length; i++) {
                    const isLast = i === lyrics.length - 1;
                    if (currentTime >= lyrics[i].time && (isLast || currentTime < lyrics[i + 1].time)) {
                        activeIndex = i;
                        break;
                    }
                }

                if (activeIndex !== -1 && activeIndex !== currentActiveIndex) {
                    currentActiveIndex = activeIndex;
                    
                    document.querySelectorAll('.lyric-line').forEach(e => e.classList.remove('active'));
                    
                    const activeEl = document.getElementById('line-' + activeIndex);
                    if (activeEl) {
                        activeEl.classList.add('active');
                        activeEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }
                }
            }
            requestAnimationFrame(syncLyrics);
        }

        // Запускаем авто-калибровку при первом воспроизведении
        audio.addEventListener('play', () => {
            if (!autoOffsetReady) autoCalibrate();
            requestAnimationFrame(syncLyrics);
        }, { once: false });

        audio.addEventListener('playing', () => {
            if (!autoOffsetReady) autoCalibrate();
            requestAnimationFrame(syncLyrics);
        });

        loadTrack();
    </script>
</body>
</html>
