<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Music Player</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #1a1a24;
            --text-active: #ffffff;
            --text-inactive: rgba(255, 255, 255, 0.35);
            --btn-bg: rgba(255, 255, 255, 0.1);
            /* Безопасные отступы для iPhone (чтобы контент не залезал под "бровь" и полоску снизу) */
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: var(--bg-color);
        }
        body {
            background-image: radial-gradient(circle at 50% 0%, #323245 0%, var(--bg-color) 70%);
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            padding-top: var(--safe-top);
            padding-bottom: var(--safe-bottom);
            height: 100vh;
            height: 100dvh; /* Динамическая высота для мобильных браузеров */
        }
        
        /* Шапка: обложка, инфа и кнопки */
        .header {
            display: flex;
            align-items: center;
            padding: 20px 20px 10px 20px;
            z-index: 10;
            flex-shrink: 0;
        }
        .cover-mini {
            width: 55px;
            height: 55px;
            border-radius: 12px;
            background: linear-gradient(135deg, #444, #111);
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            flex-shrink: 0;
            object-fit: cover;
        }
        .track-info {
            display: flex;
            flex-direction: column;
            justify-content: center;
            overflow: hidden;
            margin-left: 15px;
            flex-grow: 1;
        }
        .track-title {
            font-size: 17px;
            font-weight: 700;
            margin-bottom: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .explicit-icon {
            background-color: rgba(255,255,255,0.2);
            color: #fff;
            font-size: 9px;
            font-weight: bold;
            padding: 1px 4px;
            border-radius: 3px;
        }
        .track-artist {
            font-size: 14px;
            color: var(--text-inactive);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Кнопки справа в шапке */
        .header-actions {
            display: flex;
            gap: 8px;
            margin-left: 10px;
        }
        .icon-btn {
            background: var(--btn-bg);
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(5px);
            transition: 0.2s;
        }
        .icon-btn:active {
            background: rgba(255,255,255,0.2);
            transform: scale(0.9);
        }
        .icon-btn svg {
            fill: #fff;
            width: 18px;
            height: 18px;
        }

        /* Контейнер с текстом песни */
        .lyrics-container {
            flex-grow: 1;
            padding: 20px;
            padding-bottom: 150px;
            padding-top: 20px;
            overflow-y: auto;
            scroll-behavior: smooth;
            display: flex;
            flex-direction: column;
            mask-image: linear-gradient(to bottom, transparent 0%, black 15%, black 75%, transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 15%, black 75%, transparent 100%);
        }
        .lyrics-container::-webkit-scrollbar {
            display: none;
        }
        
        .lyric-line {
            font-size: 26px;
            font-weight: 700;
            color: var(--text-inactive);
            margin: 12px 0;
            line-height: 1.3;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            filter: blur(1.5px);
            transform-origin: left center;
            cursor: pointer;
            text-align: left;
        }
        .lyric-line.active {
            font-size: 38px;
            color: var(--text-active);
            filter: blur(0);
            margin: 25px 0;
            text-shadow: 0 4px 15px rgba(255,255,255,0.15);
        }

        /* Нижняя панель с плеером */
        .player-wrapper {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 20px;
            padding-bottom: calc(20px + var(--safe-bottom));
            background: linear-gradient(to top, rgba(26,26,36,1) 30%, rgba(26,26,36,0) 100%);
            box-sizing: border-box;
            z-index: 10;
            transition: transform 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        .player-wrapper.hidden {
            transform: translateY(100%);
        }
        
        audio {
            width: 100%;
            height: 45px;
            outline: none;
            border-radius: 25px;
        }
        
        .status-msg {
            font-size: 20px;
            font-weight: bold;
            color: var(--text-inactive);
            text-align: left;
            margin-top: 40px;
        }
    </style>
</head>
<body>

    <div class="header">
        <img class="cover-mini" id="cover-image" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=" alt="cover">
        <div class="track-info">
            <div class="track-title">
                <span id="title-display">Загрузка...</span>
                <span class="explicit-icon">E</span>
            </div>
            <div class="track-artist" id="artist-display">Подключение</div>
        </div>
        <div class="header-actions">
            <button class="icon-btn">
                <svg viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
            </button>
            <!-- Кнопка "три точки" теперь скрывает и показывает плеер -->
            <button class="icon-btn" id="toggle-player-btn" title="Скрыть/Показать плеер">
                <svg viewBox="0 0 24 24"><path d="M6 10c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm12 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm-6 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>
            </button>
        </div>
    </div>

    <div class="lyrics-container" id="lyrics">
        <div class="status-msg">Ищем текст песни... 🔍</div>
    </div>

    <div class="player-wrapper" id="player-wrap">
        <audio id="audio" controls autoplay></audio>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        
        // --- РАЗВОРАЧИВАЕМ НА ВЕСЬ ЭКРАН ---
        tg.expand(); 
        
        // Отключаем свайп вниз для закрытия приложения (мешает скроллу текста)
        if (tg.isVerticalSwipesEnabled !== undefined) {
            tg.isVerticalSwipesEnabled = false;
        }

        // Устанавливаем цвета
        tg.setHeaderColor('#1a1a24'); 
        tg.setBackgroundColor('#1a1a24');

        // Функция запроса настоящего полного экрана (скрывает верхнюю панель Telegram)
        function goFullscreen() {
            // Нативный метод Telegram (работает в новых версиях)
            if (tg.requestFullscreen) {
                tg.requestFullscreen();
            } 
            // Резервный вариант для браузера
            else if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen().catch(e => console.log(e));
            }
        }

        // ВАЖНО: Полный экран можно запросить только после действия пользователя (клика/тапа)
        // Поэтому вешаем обработчик на первый клик по экрану
        document.body.addEventListener('click', function initFullscreen() {
            goFullscreen();
            document.body.removeEventListener('click', initFullscreen);
        }, { once: true });

        // --- ОСТАЛЬНАЯ ЛОГИКА ПЛЕЕРА ---
        const JSONBIN_KEY = "$2a$10$K0t8NaC64RzHdWCbtN.i2.sUpZS28KhFhruBtunwtsz0LB8uEWRsy";

        const audio = document.getElementById('audio');
        const lyricsContainer = document.getElementById('lyrics');
        const titleDisplay = document.getElementById('title-display');
        const artistDisplay = document.getElementById('artist-display');
        const coverImage = document.getElementById('cover-image');
        
        const playerWrap = document.getElementById('player-wrap');
        const togglePlayerBtn = document.getElementById('toggle-player-btn');
        
        let lyrics = [];
        let currentActiveIndex = -1;
        const trackId = tg.initDataUnsafe?.start_param;

        // По клику на три точки плеер полностью уезжает или возвращается
        togglePlayerBtn.addEventListener('click', () => {
            playerWrap.classList.toggle('hidden');
        });

        async function loadTrack() {
            if (!trackId) {
                titleDisplay.innerText = "Ошибка";
                artistDisplay.innerText = "Трек не найден";
                lyricsContainer.innerHTML = '<div class="status-msg">Запустите плеер через бота.</div>';
                return;
            }

            try {
                const res = await fetch(`https://api.jsonbin.io/v3/b/${trackId}`, {
                    headers: { "X-Master-Key": JSONBIN_KEY }
                });
                const data = await res.json();
                const track = data.record;

                titleDisplay.innerText = track.title;
                artistDisplay.innerText = track.artist;
                audio.src = track.audio;

                fetchCover(track.title, track.artist);
                fetchLyrics(track.title, track.artist);
            } catch (e) {
                titleDisplay.innerText = "Ошибка";
                artistDisplay.innerText = "Сбой загрузки";
            }
        }

        async function fetchCover(title, artist) {
            try {
                const query = encodeURIComponent(artist + ' ' + title);
                const res = await fetch(`https://itunes.apple.com/search?term=${query}&entity=song&limit=1`);
                const data = await res.json();
                if (data.results && data.results.length > 0) {
                    coverImage.src = data.results[0].artworkUrl100;
                }
            } catch (e) {
                console.log("Обложка не найдена");
            }
        }

        async function fetchLyrics(title, artist) {
            try {
                const response = await fetch(`https://lrclib.net/api/search?track_name=${encodeURIComponent(title)}&artist_name=${encodeURIComponent(artist)}`);
                const data = await response.json();
                if (data && data.length > 0 && data[0].syncedLyrics) {
                    parseLrc(data[0].syncedLyrics);
                    renderLyrics();
                } else {
                    lyricsContainer.innerHTML = '<div class="status-msg">Текст песни не найден 😔</div>';
                }
            } catch (error) {
                lyricsContainer.innerHTML = '<div class="status-msg">Ошибка загрузки текста ❌</div>';
            }
        }

        function parseLrc(lrcText) {
            lyrics = [];
            lrcText.split('\n').forEach(line => {
                const match = /\[(\d{2}):(\d{2}\.\d{2,3})\](.*)/.exec(line);
                if (match && match[3].trim() !== '') {
                    lyrics.push({ time: (parseInt(match[1]) * 60) + parseFloat(match[2]), text: match[3].trim() });
                }
            });
        }

        function renderLyrics() {
            lyricsContainer.innerHTML = '';
            
            const padTop = document.createElement('div');
            padTop.style.height = '35vh';
            lyricsContainer.appendChild(padTop);

            lyrics.forEach((line, index) => {
                const el = document.createElement('div');
                el.className = 'lyric-line';
                el.id = 'line-' + index;
                el.innerText = line.text;
                
                el.onclick = () => {
                    audio.currentTime = line.time;
                    audio.play();
                };
                lyricsContainer.appendChild(el);
            });
            
            const padBot = document.createElement('div');
            padBot.style.height = '50vh';
            lyricsContainer.appendChild(padBot);
            
            requestAnimationFrame(syncLyrics);
        }

        function syncLyrics() {
            if (lyrics.length > 0 && !audio.paused) {
                const LYRIC_OFFSET = 0.45; 
                const currentTime = audio.currentTime + LYRIC_OFFSET;
                
                let activeIndex = -1;
                for (let i = 0; i < lyrics.length; i++) {
                    const isLast = i === lyrics.length - 1;
                    if (currentTime >= lyrics[i].time && (isLast || currentTime < lyrics[i + 1].time)) {
                        activeIndex = i;
                        break;
                    }
                }

                if (activeIndex !== -1 && activeIndex !== currentActiveIndex) {
                    currentActiveIndex = activeIndex;
                    
                    document.querySelectorAll('.lyric-line').forEach(e => e.classList.remove('active'));
                    
                    const activeEl = document.getElementById('line-' + activeIndex);
                    if (activeEl) {
                        activeEl.classList.add('active');
                        activeEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }
                }
            }
            requestAnimationFrame(syncLyrics);
        }

        audio.addEventListener('play', () => {
            requestAnimationFrame(syncLyrics);
        });

        loadTrack();
    </script>
</body>
</html>
