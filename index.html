<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Player</title>
    <!-- Подключаем скрипт Telegram Web Apps -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            box-sizing: border-box;
            overflow: hidden;
        }
        .cover {
            width: 200px;
            height: 200px;
            background: linear-gradient(135deg, #4b0082, #000000);
            border-radius: 12px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .controls {
            width: 100%;
            max-width: 350px;
            margin-bottom: 30px;
        }
        audio {
            width: 100%;
            outline: none;
        }
        .lyrics-container {
            flex-grow: 1;
            width: 100%;
            max-width: 350px;
            overflow-y: scroll;
            text-align: center;
            scroll-behavior: smooth;
            padding-bottom: 50px;
        }
        /* Скрываем скроллбар для красоты */
        .lyrics-container::-webkit-scrollbar { display: none; }
        
        .lyric-line {
            font-size: 18px;
            margin: 15px 0;
            color: #888;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .lyric-line.active {
            color: #1db954; /* Зеленый цвет как в Spotify */
            font-size: 24px;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(29, 185, 84, 0.5);
        }
    </style>
</head>
<body>

    <!-- Обложка -->
    <div class="cover"></div>
    
    <!-- Аудиоплеер (вставил прямую ссылку на тестовый звук для проверки) -->
    <div class="controls">
        <audio id="audio" controls src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"></audio>
    </div>

    <!-- Контейнер для текста -->
    <div class="lyrics-container" id="lyrics"></div>

    <script>
        // Сообщаем Telegram, что приложение готово
        const tg = window.Telegram.WebApp;
        tg.expand(); // Открываем на весь экран

        // Формат LRC (время в секундах и текст)
        // В реальном проекте этот текст будет прилетать от бота или API
        const rawLrc = `
        [00:00.00] Музыка начинается...
        [00:05.50] Это первая строчка песни
        [00:09.20] А это вторая, она подсветится позже
        [00:14.00] Мы синхронизируем текст с аудио
        [00:18.50] Как в настоящем караоке
        [00:23.00] Telegram Mini App в действии!
        `;

        const audio = document.getElementById('audio');
        const lyricsContainer = document.getElementById('lyrics');
        let lyrics = [];

        // Парсер LRC формата
        function parseLrc(lrcText) {
            const lines = lrcText.split('\n');
            const regex = /\[(\d{2}):(\d{2}\.\d{2,3})\](.*)/;
            
            lines.forEach(line => {
                const match = regex.exec(line);
                if (match) {
                    const minutes = parseInt(match[1]);
                    const seconds = parseFloat(match[2]);
                    const text = match[3].trim();
                    const time = (minutes * 60) + seconds;
                    if(text) lyrics.push({ time, text });
                }
            });
        }

        // Отрисовка текста на экране
        function renderLyrics() {
            lyricsContainer.innerHTML = '';
            lyrics.forEach((line, index) => {
                const el = document.createElement('div');
                el.className = 'lyric-line';
                el.id = 'line-' + index;
                el.innerText = line.text;
                // Клик по тексту перематывает песню
                el.onclick = () => audio.currentTime = line.time;
                lyricsContainer.appendChild(el);
            });
        }

        // Синхронизация: следим за временем плеера и меняем классы
        audio.addEventListener('timeupdate', () => {
            const currentTime = audio.currentTime;
            
            for (let i = 0; i < lyrics.length; i++) {
                const isLastLine = i === lyrics.length - 1;
                const isCurrent = currentTime >= lyrics[i].time && (isLastLine || currentTime < lyrics[i + 1].time);
                
                const lineElement = document.getElementById('line-' + i);
                
                if (isCurrent) {
                    if (!lineElement.classList.contains('active')) {
                        // Убираем active у всех
                        document.querySelectorAll('.lyric-line').forEach(el => el.classList.remove('active'));
                        // Добавляем текущему
                        lineElement.classList.add('active');
                        // Плавно скроллим контейнер к активной строке
                        lineElement.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }
                    break;
                }
            }
        });

        // Запуск
        parseLrc(rawLrc);
        renderLyrics();
    </script>
</body>
</html>
