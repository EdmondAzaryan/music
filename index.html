<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Music Player</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #1a1a24;
            --text-active: #ffffff;
            --text-inactive: rgba(255, 255, 255, 0.35);
        }
        body {
            background-color: var(--bg-color);
            /* Легкий радиальный градиент на фоне для объема */
            background-image: radial-gradient(circle at 50% 0%, #323245 0%, var(--bg-color) 70%);
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-sizing: border-box;
        }
        
        /* Шапка: мини-обложка и инфа о треке */
        .header {
            display: flex;
            align-items: center;
            padding: 20px 20px 10px 20px;
            z-index: 10;
        }
        .cover-mini {
            width: 50px;
            height: 50px;
            border-radius: 8px;
            background: linear-gradient(135deg, #444, #111);
            margin-right: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            flex-shrink: 0;
        }
        .track-info {
            display: flex;
            flex-direction: column;
            justify-content: center;
            overflow: hidden;
        }
        .track-title {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .track-artist {
            font-size: 13px;
            color: var(--text-inactive);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Контейнер с текстом песни */
        .lyrics-container {
            flex-grow: 1;
            padding: 20px;
            padding-bottom: 150px;
            padding-top: 20px;
            overflow-y: auto;
            scroll-behavior: smooth;
            display: flex;
            flex-direction: column;
            /* Плавное растворение текста сверху и снизу */
            mask-image: linear-gradient(to bottom, transparent 0%, black 15%, black 75%, transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 15%, black 75%, transparent 100%);
        }
        .lyrics-container::-webkit-scrollbar {
            display: none;
        }
        
        /* Стилизация самих строчек (эффект TikTok / Apple Music) */
        .lyric-line {
            font-size: 26px;
            font-weight: 700;
            color: var(--text-inactive);
            margin: 12px 0;
            line-height: 1.3;
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            filter: blur(1.5px);
            transform-origin: left center;
            cursor: pointer;
            text-align: left;
        }
        .lyric-line.active {
            font-size: 38px;
            color: var(--text-active);
            filter: blur(0);
            margin: 25px 0;
            text-shadow: 0 4px 15px rgba(255,255,255,0.15);
        }

        /* Нижняя панель с плеером */
        .player-wrapper {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 20px;
            background: linear-gradient(to top, rgba(26,26,36,1) 30%, rgba(26,26,36,0) 100%);
            box-sizing: border-box;
            z-index: 10;
        }
        audio {
            width: 100%;
            height: 45px;
            outline: none;
            border-radius: 25px;
        }
        
        .status-msg {
            font-size: 20px;
            font-weight: bold;
            color: var(--text-inactive);
            text-align: left;
            margin-top: 40px;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="cover-mini"></div>
        <div class="track-info">
            <div class="track-title" id="title-display">Загрузка...</div>
            <div class="track-artist" id="artist-display">Подключение</div>
        </div>
    </div>

    <div class="lyrics-container" id="lyrics">
        <div class="status-msg">Ищем текст песни... 🔍</div>
    </div>

    <div class="player-wrapper">
        <audio id="audio" controls autoplay></audio>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        // Красим системную шапку телеграма в цвет нашего фона
        tg.setHeaderColor('#1a1a24'); 
        tg.setBackgroundColor('#1a1a24');

        const JSONBIN_KEY = "$2a$10$K0t8NaC64RzHdWCbtN.i2.sUpZS28KhFhruBtunwtsz0LB8uEWRsy";

        const audio = document.getElementById('audio');
        const lyricsContainer = document.getElementById('lyrics');
        const titleDisplay = document.getElementById('title-display');
        const artistDisplay = document.getElementById('artist-display');
        let lyrics = [];

        const trackId = tg.initDataUnsafe?.start_param;

        async function loadTrack() {
            if (!trackId) {
                titleDisplay.innerText = "Ошибка";
                artistDisplay.innerText = "Трек не найден";
                lyricsContainer.innerHTML = '<div class="status-msg">Запустите плеер через бота.</div>';
                return;
            }

            try {
                const res = await fetch(`https://api.jsonbin.io/v3/b/${trackId}`, {
                    headers: { "X-Master-Key": JSONBIN_KEY }
                });
                const data = await res.json();
                const track = data.record;

                titleDisplay.innerText = track.title;
                artistDisplay.innerText = track.artist;
                audio.src = track.audio;

                fetchLyrics(track.title, track.artist);
            } catch (e) {
                titleDisplay.innerText = "Ошибка";
                artistDisplay.innerText = "Сбой загрузки";
            }
        }

        async function fetchLyrics(title, artist) {
            try {
                const response = await fetch(`https://lrclib.net/api/search?track_name=${encodeURIComponent(title)}&artist_name=${encodeURIComponent(artist)}`);
                const data = await response.json();
                if (data && data.length > 0 && data[0].syncedLyrics) {
                    parseLrc(data[0].syncedLyrics);
                    renderLyrics();
                } else {
                    lyricsContainer.innerHTML = '<div class="status-msg">Текст песни не найден 😔</div>';
                }
            } catch (error) {
                lyricsContainer.innerHTML = '<div class="status-msg">Ошибка загрузки текста ❌</div>';
            }
        }

        function parseLrc(lrcText) {
            lyrics = [];
            lrcText.split('\n').forEach(line => {
                const match = /\[(\d{2}):(\d{2}\.\d{2,3})\](.*)/.exec(line);
                if (match && match[3].trim() !== '') {
                    lyrics.push({ time: (parseInt(match[1]) * 60) + parseFloat(match[2]), text: match[3].trim() });
                }
            });
        }

        function renderLyrics() {
            lyricsContainer.innerHTML = '';
            
            // Пустой блок сверху, чтобы первая строчка начиналась с середины экрана
            const padTop = document.createElement('div');
            padTop.style.height = '35vh';
            lyricsContainer.appendChild(padTop);

            lyrics.forEach((line, index) => {
                const el = document.createElement('div');
                el.className = 'lyric-line';
                el.id = 'line-' + index;
                el.innerText = line.text;
                // При клике на строчку песня перематывается на этот момент
                el.onclick = () => {
                    audio.currentTime = line.time;
                    audio.play();
                };
                lyricsContainer.appendChild(el);
            });
            
            // Пустой блок снизу, чтобы можно было докрутить до конца
            const padBot = document.createElement('div');
            padBot.style.height = '50vh';
            lyricsContainer.appendChild(padBot);
        }

        audio.addEventListener('timeupdate', () => {
            if (lyrics.length === 0) return;
            const currentTime = audio.currentTime;
            
            let activeIndex = -1;
            for (let i = 0; i < lyrics.length; i++) {
                const isLast = i === lyrics.length - 1;
                if (currentTime >= lyrics[i].time && (isLast || currentTime < lyrics[i + 1].time)) {
                    activeIndex = i;
                    break;
                }
            }

            if (activeIndex !== -1) {
                const el = document.getElementById('line-' + activeIndex);
                if (el && !el.classList.contains('active')) {
                    // Убираем класс active у всех
                    document.querySelectorAll('.lyric-line').forEach(e => e.classList.remove('active'));
                    // Добавляем текущей
                    el.classList.add('active');
                    // Центрируем активную строчку на экране
                    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            }
        });

        loadTrack();
    </script>
</body>
</html>
