<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Music Player</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #1a1a24;
            --bg-color-2: #323245;
            --text-active: #ffffff;
            --text-inactive: rgba(255, 255, 255, 0.35);
            --btn-bg: rgba(255, 255, 255, 0.12);
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000;
        }
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            height: 100dvh;
            box-sizing: border-box;
            /* Отступы сверху и снизу, чтобы приложение не залезало под панели Telegram */
            padding-top: 50px;
            padding-bottom: 30px;
        }

        /* ===== КОНТЕЙНЕР ФОРМАТА 3:4 ===== */
        .app-container {
            width: 100%;
            max-width: 100vw;
            height: 75vh; /* Формат 3:4 */
            max-height: 75dvh;
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at 50% 0%, var(--bg-color-2) 0%, var(--bg-color) 70%);
            border-radius: 18px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            position: relative;
            transition: background 1s ease, background-image 1s ease;
        }

        .header {
            display: flex;
            align-items: center;
            padding: 15px 15px 10px 15px;
            z-index: 10;
            flex-shrink: 0;
        }
        .cover-mini {
            width: 45px;
            height: 45px;
            border-radius: 10px;
            background: linear-gradient(135deg, #444, #111);
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            flex-shrink: 0;
            object-fit: cover;
        }
        .track-info {
            display: flex;
            flex-direction: column;
            justify-content: center;
            overflow: hidden;
            margin-left: 12px;
            flex-grow: 1;
        }
        .track-title {
            font-size: 15px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .explicit-icon {
            background-color: rgba(255,255,255,0.2);
            color: #fff;
            font-size: 8px;
            font-weight: bold;
            padding: 1px 4px;
            border-radius: 3px;
        }
        .track-artist {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.75);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .header-actions {
            display: flex;
            gap: 6px;
            margin-left: 8px;
        }
        .icon-btn {
            background: var(--btn-bg);
            border: none;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(5px);
            transition: 0.2s;
        }
        .icon-btn:active {
            background: rgba(255,255,255,0.2);
            transform: scale(0.9);
        }
        .icon-btn svg {
            fill: #fff;
            width: 15px;
            height: 15px;
        }

        .lyrics-container {
            flex-grow: 1;
            padding: 15px;
            overflow-y: auto;
            scroll-behavior: smooth;
            display: flex;
            flex-direction: column;
            mask-image: linear-gradient(to bottom, transparent 0%, black 15%, black 75%, transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 15%, black 75%, transparent 100%);
        }
        .lyrics-container::-webkit-scrollbar {
            display: none;
        }
        
        .lyric-line {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-inactive);
            margin: 10px 0;
            line-height: 1.3;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            filter: blur(1.5px);
            transform-origin: left center;
            cursor: pointer;
            text-align: left;
        }
        .lyric-line.active {
            font-size: 28px;
            color: var(--text-active);
            filter: blur(0);
            margin: 18px 0;
            text-shadow: 0 4px 15px rgba(255,255,255,0.15);
        }

        .player-wrapper {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 12px;
            background: linear-gradient(to top, rgba(0,0,0,0.6) 30%, rgba(0,0,0,0) 100%);
            box-sizing: border-box;
            z-index: 10;
            transition: transform 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        .player-wrapper.hidden {
            transform: translateY(100%);
        }
        
        audio {
            width: 100%;
            height: 36px;
            outline: none;
            border-radius: 20px;
        }
        
        .status-msg {
            font-size: 16px;
            font-weight: bold;
            color: var(--text-inactive);
            text-align: left;
            margin-top: 30px;
        }
    </style>
</head>
<body>

    <div class="app-container" id="app-container">

        <div class="header">
            <img class="cover-mini" id="cover-image" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=" alt="cover">
            <div class="track-info">
                <div class="track-title">
                    <span id="title-display">Загрузка...</span>
                    <span class="explicit-icon">E</span>
                </div>
                <div class="track-artist" id="artist-display">Подключение</div>
            </div>
            <div class="header-actions">
                <button class="icon-btn" id="star-btn">
                    <svg viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
                </button>
                <button class="icon-btn" id="toggle-player-btn" title="Скрыть/Показать плеер">
                    <svg viewBox="0 0 24 24"><path d="M6 10c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm12 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm-6 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>
                </button>
            </div>
        </div>

        <div class="lyrics-container" id="lyrics">
            <div class="status-msg">Ищем текст песни... 🔍</div>
        </div>

        <div class="player-wrapper" id="player-wrap">
            <audio id="audio" controls autoplay></audio>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        
        tg.expand(); 
        
        if (tg.isVerticalSwipesEnabled !== undefined) {
            tg.isVerticalSwipesEnabled = false;
        }

        tg.setHeaderColor('#000000'); 
        tg.setBackgroundColor('#000000');

        function goFullscreen() {
            if (tg.requestFullscreen) {
                tg.requestFullscreen();
            } else if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen().catch(e => console.log(e));
            }
        }

        document.body.addEventListener('click', function initFullscreen() {
            goFullscreen();
            document.body.removeEventListener('click', initFullscreen);
        }, { once: true });

        const JSONBIN_KEY = "$2a$10$K0t8NaC64RzHdWCbtN.i2.sUpZS28KhFhruBtunwtsz0LB8uEWRsy";

        const audio = document.getElementById('audio');
        const lyricsContainer = document.getElementById('lyrics');
        const titleDisplay = document.getElementById('title-display');
        const artistDisplay = document.getElementById('artist-display');
        const coverImage = document.getElementById('cover-image');
        const appContainer = document.getElementById('app-container');
        
        const playerWrap = document.getElementById('player-wrap');
        const togglePlayerBtn = document.getElementById('toggle-player-btn');
        const starBtn = document.getElementById('star-btn');
        
        let lyrics = [];
        let currentActiveIndex = -1;
        const trackId = tg.initDataUnsafe?.start_param;

        togglePlayerBtn.addEventListener('click', () => {
            playerWrap.classList.toggle('hidden');
        });

        starBtn.addEventListener('click', () => {
            const path = starBtn.querySelector('path');
            if (path.style.fill === 'rgb(255, 215, 0)' || path.style.fill === '#FFD700') {
                path.style.fill = '#fff';
            } else {
                path.style.fill = '#FFD700';
            }
        });

        async function loadTrack() {
            if (!trackId) {
                titleDisplay.innerText = "Ошибка";
                artistDisplay.innerText = "Трек не найден";
                lyricsContainer.innerHTML = '<div class="status-msg">Запустите плеер через бота.</div>';
                return;
            }

            try {
                const res = await fetch(`https://api.jsonbin.io/v3/b/${trackId}`, {
                    headers: { "X-Master-Key": JSONBIN_KEY }
                });
                const data = await res.json();
                const track = data.record;

                titleDisplay.innerText = track.title;
                artistDisplay.innerText = track.artist;
                audio.src = track.audio;

                fetchCover(track.title, track.artist);
                fetchLyrics(track.title, track.artist);
            } catch (e) {
                titleDisplay.innerText = "Ошибка";
                artistDisplay.innerText = "Сбой загрузки";
            }
        }

        async function fetchCover(title, artist) {
            try {
                const query = encodeURIComponent(artist + ' ' + title);
                const res = await fetch(`https://itunes.apple.com/search?term=${query}&entity=song&limit=1`);
                const data = await res.json();
                if (data.results && data.results.length > 0) {
                    const coverUrl = data.results[0].artworkUrl100.replace('100x100', '600x600');
                    coverImage.src = coverUrl;
                    coverImage.crossOrigin = "Anonymous";
                    
                    coverImage.onload = () => {
                        extractColorFromCover(coverImage);
                    };
                }
            } catch (e) {
                console.log("Обложка не найдена");
            }
        }

        // ===== ИЗВЛЕЧЕНИЕ ЦВЕТА С СИЛЬНЫМ ЗАТЕМНЕНИЕМ (как Apple Music) =====
        function extractColorFromCover(img) {
            try {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                canvas.width = 50;
                canvas.height = 50;
                ctx.drawImage(img, 0, 0, 50, 50);
                
                const imageData = ctx.getImageData(0, 0, 50, 50).data;
                let r = 0, g = 0, b = 0, count = 0;
                
                for (let i = 0; i < imageData.length; i += 4) {
                    r += imageData[i];
                    g += imageData[i + 1];
                    b += imageData[i + 2];
                    count++;
                }
                
                r = Math.floor(r / count);
                g = Math.floor(g / count);
                b = Math.floor(b / count);
                
                // СИЛЬНО затемняем цвет, чтобы фон был тёмным, но с оттенком обложки
                const darkR = Math.floor(r * 0.18);
                const darkG = Math.floor(g * 0.18);
                const darkB = Math.floor(b * 0.18);
                
                const lightR = Math.floor(r * 0.30);
                const lightG = Math.floor(g * 0.30);
                const lightB = Math.floor(b * 0.30);
                
                document.documentElement.style.setProperty('--bg-color', `rgb(${darkR}, ${darkG}, ${darkB})`);
                document.documentElement.style.setProperty('--bg-color-2', `rgb(${lightR}, ${lightG}, ${lightB})`);
                
                console.log(`Цвет обложки: rgb(${r}, ${g}, ${b}) → фон rgb(${darkR}, ${darkG}, ${darkB})`);
            } catch (e) {
                console.log("Не удалось извлечь цвет:", e);
            }
        }

        async function fetchLyrics(title, artist) {
            try {
                const response = await fetch(`https://lrclib.net/api/search?track_name=${encodeURIComponent(title)}&artist_name=${encodeURIComponent(artist)}`);
                const data = await response.json();
                if (data && data.length > 0 && data[0].syncedLyrics) {
                    parseLrc(data[0].syncedLyrics);
                    renderLyrics();
                } else {
                    lyricsContainer.innerHTML = '<div class="status-msg">Текст песни не найден 😔</div>';
                }
            } catch (error) {
                lyricsContainer.innerHTML = '<div class="status-msg">Ошибка загрузки текста ❌</div>';
            }
        }

        function parseLrc(lrcText) {
            lyrics = [];
            lrcText.split('\n').forEach(line => {
                const match = /\[(\d{2}):(\d{2}\.\d{2,3})\](.*)/.exec(line);
                if (match && match[3].trim() !== '') {
                    lyrics.push({ time: (parseInt(match[1]) * 60) + parseFloat(match[2]), text: match[3].trim() });
                }
            });
        }

        function renderLyrics() {
            lyricsContainer.innerHTML = '';
            
            const padTop = document.createElement('div');
            padTop.style.height = '35vh';
            lyricsContainer.appendChild(padTop);

            lyrics.forEach((line, index) => {
                const el = document.createElement('div');
                el.className = 'lyric-line';
                el.id = 'line-' + index;
                el.innerText = line.text;
                
                el.onclick = () => {
                    audio.currentTime = line.time;
                    audio.play();
                };
                lyricsContainer.appendChild(el);
            });
            
            const padBot = document.createElement('div');
            padBot.style.height = '50vh';
            lyricsContainer.appendChild(padBot);
            
            requestAnimationFrame(syncLyrics);
        }

        function syncLyrics() {
            if (lyrics.length > 0 && !audio.paused) {
                const LYRIC_OFFSET = 0.45; 
                const currentTime = audio.currentTime + LYRIC_OFFSET;
                
                let activeIndex = -1;
                for (let i = 0; i < lyrics.length; i++) {
                    const isLast = i === lyrics.length - 1;
                    if (currentTime >= lyrics[i].time && (isLast || currentTime < lyrics[i + 1].time)) {
                        activeIndex = i;
                        break;
                    }
                }

                if (activeIndex !== -1 && activeIndex !== currentActiveIndex) {
                    currentActiveIndex = activeIndex;
                    
                    document.querySelectorAll('.lyric-line').forEach(e => e.classList.remove('active'));
                    
                    const activeEl = document.getElementById('line-' + activeIndex);
                    if (activeEl) {
                        activeEl.classList.add('active');
                        activeEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }
                }
            }
            requestAnimationFrame(syncLyrics);
        }

        audio.addEventListener('play', () => {
            requestAnimationFrame(syncLyrics);
        });

        loadTrack();
    </script>
</body>
</html>
